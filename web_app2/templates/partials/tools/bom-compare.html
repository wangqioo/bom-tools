<script type="text/html" id="tpl-bom-compare">
<div style="display:flex;gap:8px;margin-bottom:18px;border-bottom:2px solid #e0e4ef;padding-bottom:0;flex-wrap:wrap">
  <button class="bomcmp-tab-btn active" data-bomcmp-tab="free-bom" style="padding:6px 18px;border:none;background:none;font-size:13px;font-weight:600;color:#1a5ad4;border-bottom:2px solid #1a5ad4;margin-bottom:-2px;cursor:pointer">通用BOM对比 <span class="tool-version" data-tool-version="free-bom-compare">v{{ tool_versions['free-bom-compare'] }}</span></button>
  <button class="bomcmp-tab-btn" data-bomcmp-tab="customer-hq" style="padding:6px 18px;border:none;background:none;font-size:13px;font-weight:600;color:#888;border-bottom:2px solid transparent;margin-bottom:-2px;cursor:pointer">客户BOM对比HQ BOM <span class="tool-version" data-tool-version="customer-hq-compare">v{{ tool_versions['customer-hq-compare'] }}</span></button>
  <button class="bomcmp-tab-btn" data-bomcmp-tab="hq-version" style="padding:6px 18px;border:none;background:none;font-size:13px;font-weight:600;color:#888;border-bottom:2px solid transparent;margin-bottom:-2px;cursor:pointer">单板HQ BOM版本对比 <span class="tool-version" data-tool-version="hq-version-compare">v{{ tool_versions['hq-version-compare'] }}</span></button>
  <button class="bomcmp-tab-btn" data-bomcmp-tab="machine-hq-version" style="padding:6px 18px;border:none;background:none;font-size:13px;font-weight:600;color:#888;border-bottom:2px solid transparent;margin-bottom:-2px;cursor:pointer">整机HQ BOM版本对比 <span class="tool-version" data-tool-version="machine-hq-version-compare">v{{ tool_versions['machine-hq-version-compare'] }}</span></button>
  <button class="bomcmp-tab-btn" data-bomcmp-tab="cadence-hq" style="padding:6px 18px;border:none;background:none;font-size:13px;font-weight:600;color:#888;border-bottom:2px solid transparent;margin-bottom:-2px;cursor:pointer">Cadence导出BOM对比HQ BOM <span class="tool-version" data-tool-version="cadence-hq-compare">v{{ tool_versions['cadence-hq-compare'] }}</span></button>
</div>

<div id="bomcmp-tab-free-bom" class="workflow-shell">
  <div class="workflow-hero"><h4>通用BOM对比 <span class="tool-version" data-tool-version="free-bom-compare">v{{ tool_versions['free-bom-compare'] }}</span></h4><p>不限制 BOM 固定模板。上传两份 Excel，手动选择 Sheet、表头行、匹配键和需要比对的字段后输出差异报告。</p></div>
  <div class="section"><h3>第一步：上传并预览两份 BOM</h3><div class="workflow-step-desc">两份文件都按普通 Excel 读取。上传后先查看下方预览。</div><div class="row"><label>基准 BOM：</label><input type="file" id="freeLeftFile" accept=".xlsx,.xlsm,.xls" style="width:320px"></div><div class="row"><label>对比 BOM：</label><input type="file" id="freeRightFile" accept=".xlsx,.xlsm,.xls" style="width:320px"></div><div class="bom-preview-grid"><div><div class="bom-preview-title">基准 BOM 预览 <span>点击行号选择表头</span></div><div class="table-wrap bom-preview-table"><table><tbody id="freeLeftPreviewRows"><tr><td>上传文件后显示前 12 行</td></tr></tbody></table></div></div><div><div class="bom-preview-title">对比 BOM 预览 <span>点击行号选择表头</span></div><div class="table-wrap bom-preview-table"><table><tbody id="freeRightPreviewRows"><tr><td>上传文件后显示前 12 行</td></tr></tbody></table></div></div></div></div>
  <div class="section"><h3>第二步：确认表头行</h3><div class="workflow-step-desc">请在上方预览表格中点击表头所在行的行号或整行，系统会把该行作为字段名读取；也可以手动输入表头行号，然后点击「加载列」。</div><div class="row"><label>基准 Sheet：</label><select id="freeLeftSheet" style="width:180px"><option>先选择文件</option></select><label>基准表头行：</label><input type="number" id="freeLeftHdr" value="1" min="1" style="width:60px"><label>对比 Sheet：</label><select id="freeRightSheet" style="width:180px"><option>先选择文件</option></select><label>对比表头行：</label><input type="number" id="freeRightHdr" value="1" min="1" style="width:60px"><button class="btn btn-sm btn-gray" id="freeRefresh" type="button">加载列</button></div><div id="freeLoadStatus" style="font-size:12px;color:#888"></div></div>
  <div class="section"><h3>第三步：选择匹配键和字段</h3><div class="workflow-step-desc">这里分成两个动作：先选择匹配键定位同一个物料，再选择需要检查差异的字段。</div><div class="bom-rule-panel"><h4>3.1 选择匹配键</h4><p>匹配键只用于判断两边哪两行是同一个物料，通常选择料号、型号或位号。</p><div class="row"><label>基准匹配键：</label><select id="freeLeftKey" style="width:220px"><option>先加载列</option></select><label>对比匹配键：</label><select id="freeRightKey" style="width:220px"><option>先加载列</option></select></div></div><div class="bom-rule-panel"><h4>3.2 选择需要比对的字段</h4><p>请勾选真正要检查变化的字段，例如型号、数量、位号、厂家、备注；未勾选的字段不会进入差异判断。</p><div class="row"><button class="btn btn-sm btn-gray" id="freeSelectAll" type="button">全选同名字段</button><button class="btn btn-sm btn-gray" id="freeSelectNone" type="button">清空同名字段</button><button class="btn btn-sm btn-gray" id="freeAddPair" type="button">添加不同列名字段</button><span class="hint">两边列名不一致时使用，例如 Qty 对 Quantity。</span></div><div id="freeCommonPairs" class="chk-list" style="max-height:180px"></div><div id="freeManualPairs" style="display:flex;flex-direction:column;gap:6px;margin-top:10px"></div></div></div>
  <div class="section"><h3>第四步：导出报告</h3><button class="btn btn-primary" id="freeRun" type="button">开始比对</button><span id="freeStatus" style="font-size:13px;color:#888;margin-left:8px"></span></div><div class="result" id="freeResult"><span class="title">比对完成</span><br><span id="freeStats" style="display:inline-block;margin-top:6px"></span><br><a class="download" id="freeDl" href="#">下载差异报告</a></div><div class="error" id="freeError"></div>
</div>

<div id="bomcmp-tab-customer-hq" class="workflow-shell" style="display:none">
  <div class="workflow-hero"><h4>客户BOM对比HQ BOM <span class="tool-version" data-tool-version="customer-hq-compare">v{{ tool_versions['customer-hq-compare'] }}</span></h4><p>映射客户列并选择匹配模式，生成客户 BOM 与 HQ BOM 的标准化预览和详细比对报告。</p></div>
  <div class="section"><h3>第一步：上传并读取文件</h3>
    <div class="workflow-step-desc">客户 BOM 格式不固定；HQ BOM 按标准 HQ BOM 或 PLM 全量 BOM 自动识别。先确认 Sheet 和表头行，再加载字段。</div>
    <div class="row"><label>客户 BOM：</label><input type="file" id="custLeftFile" accept=".xlsx,.xlsm,.xls" style="width:320px"></div>
    <div class="row"><label>HQ BOM：</label><input type="file" id="custRightFile" accept=".xlsx,.xlsm,.xls" style="width:320px"></div>
    <div class="row"><label>客户 Sheet：</label><select id="custLeftSheet" style="width:180px"><option>先选择文件</option></select><label>客户表头行：</label><input type="number" id="custLeftHdr" value="1" min="1" style="width:60px"><label>HQ Sheet：</label><select id="custRightSheet" style="width:180px"><option>先选择文件</option></select><button class="btn btn-sm btn-gray" id="custRefresh" type="button">加载字段</button></div>
    <div id="custLoadStatus" style="font-size:12px;color:#888"></div>
  </div>
  <div class="section"><h3>第二步：确认匹配规则和字段映射</h3>
    <div class="workflow-step-desc">这里分成两个动作：先选择匹配规则定位同一个物料，再把客户 BOM 中不固定的列映射到标准字段。</div>
    <div class="bom-rule-panel"><h4>2.1 选择匹配规则</h4><p>没有可靠位号时使用型号+制造商；客户 BOM 和 HQ BOM 都有位号时可按位号匹配。</p><div class="row"><label>匹配模式：</label><select id="custMatchMode" style="width:240px"><option value="identity">按型号+制造商匹配</option><option value="refdes">按位号匹配</option></select></div></div>
    <div class="bom-rule-panel"><h4>2.2 映射客户 BOM 字段</h4><p>规格型号和制造商必选；按位号匹配时位号必选。数量会参与差异判断，未映射则不比较客户数量。</p><div class="row" style="display:grid;grid-template-columns:repeat(4,minmax(170px,1fr));gap:10px;align-items:end">
      <label style="display:flex;flex-direction:column;gap:6px;min-width:0">规格型号：<select id="custMapModel" style="width:100%"><option value="">先加载列</option></select></label>
      <label style="display:flex;flex-direction:column;gap:6px;min-width:0">制造商：<select id="custMapManufacturer" style="width:100%"><option value="">先加载列</option></select></label>
      <label style="display:flex;flex-direction:column;gap:6px;min-width:0">位号：<select id="custMapRefdes" style="width:100%"><option value="">不使用位号</option></select></label>
      <label style="display:flex;flex-direction:column;gap:6px;min-width:0">数量/用量：<select id="custMapQuantity" style="width:100%"><option value="">不映射</option></select></label>
    </div></div>
  </div>
  <div class="section"><h3>第三步：预览或导出</h3><button class="btn btn-primary" id="custPreview" type="button">预览标准化结果</button><button class="btn btn-outline" id="custExport" type="button">下载详细比对报告</button><span id="custStatus" style="font-size:13px;color:#888;margin-left:8px"></span><div class="error" id="custError"></div><div class="result" id="custExportResult"><span class="title">详细比对报告已生成</span><br><span id="custExportStats" style="display:inline-block;margin-top:6px"></span><br><a class="download" id="custExportDl" href="#">下载详细比对报告</a></div></div>
  <div class="section" id="custPreviewPanel" style="display:none"><h3>标准化预览</h3><div id="custPreviewStats" style="font-size:13px;color:#555;margin-bottom:10px"></div><h4 style="font-size:13px;color:#1a3a5c;margin:8px 0">客户标准化预览</h4><div class="table-wrap" style="max-height:260px"><table><thead><tr><th>原始行号</th><th>匹配键</th><th>位号</th><th>规格型号</th><th>原始制造商</th><th>映射后制造商</th><th>数量</th><th>状态</th><th>问题说明</th></tr></thead><tbody id="custCustomerPreviewRows"></tbody></table></div><h4 style="font-size:13px;color:#1a3a5c;margin:12px 0 8px">HQ标准化预览</h4><div class="table-wrap" style="max-height:260px"><table><thead><tr><th>原始行号</th><th>匹配键</th><th>位号</th><th>型号</th><th>生产厂家</th><th>映射后厂家</th><th>单耗</th><th>料号</th><th>替代关系</th><th>状态</th><th>问题说明</th></tr></thead><tbody id="custHqPreviewRows"></tbody></table></div></div>
</div>
<div id="bomcmp-tab-hq-version" class="workflow-shell" style="display:none">
  <div class="workflow-hero"><h4>单板HQ BOM版本对比 <span class="tool-version" data-tool-version="hq-version-compare">v{{ tool_versions['hq-version-compare'] }}</span></h4><p>上传同一单板项目的基准版本和对比版本 HQ BOM，输出新增、删除、变更和未变更差异报告。</p></div>
  <div class="section"><h3>第一步：上传基准版本和对比版本</h3><div class="workflow-step-desc">选择两份 HQ BOM，确认 Sheet 和表头行。</div><div class="row"><label>基准版本 BOM：</label><input type="file" id="hqvOldFile" accept=".xlsx,.xlsm,.xls" style="width:320px"></div><div class="row"><label>对比版本 BOM：</label><input type="file" id="hqvNewFile" accept=".xlsx,.xlsm,.xls" style="width:320px"></div><div class="row"><label>基准版本 Sheet：</label><select id="hqvOldSheet" style="width:180px"><option>先选择文件</option></select><label>对比版本 Sheet：</label><select id="hqvNewSheet" style="width:180px"><option>先选择文件</option></select><label>表头行：</label><input type="number" id="hqvHdr" value="3" min="1" style="width:60px"><button class="btn btn-sm btn-gray" id="hqvRefresh" type="button">刷新列</button></div><div id="hqvLoadStatus" style="font-size:12px;color:#888"></div></div>
  <div class="section"><h3>第二步：确认比对规则</h3><div class="workflow-step-desc">匹配键用于定位同一物料；下方勾选需要检查变化的字段。</div><div class="plm-info" id="hqvRuleSummary">匹配规则：按「料号」匹配同一物料</div><div class="row"><label style="min-width:120px">需要检查变化的字段：</label><button class="btn btn-sm btn-gray" id="hqvSelectAll" type="button">全选字段</button><button class="btn btn-sm btn-gray" id="hqvSelectNone" type="button">清空字段</button></div><div id="hqvCompareCols" class="chk-list" style="max-height:220px"></div><details style="margin-top:10px"><summary style="cursor:pointer;font-size:12px;color:#1a5ad4;font-weight:600">高级设置：修改匹配键</summary><div class="row" style="margin-top:10px"><label>匹配键：</label><select id="hqvKeyCol" style="width:220px"><option>先刷新列</option></select><span class="hint">系统导出 HQ BOM 通常使用「料号」。</span></div></details></div>
  <div class="section"><h3>第三步：输出差异报告</h3><div class="workflow-step-desc">报告包含新增、删除、变更和统计 Sheet。</div><button class="btn btn-primary" id="hqvRun" type="button">开始比对</button><span id="hqvStatus" style="font-size:13px;color:#888;margin-left:8px"></span></div><div class="result" id="hqvResult"><span class="title">比对完成</span><br><span id="hqvStats" style="display:inline-block;margin-top:6px"></span><br><a class="download" id="hqvDl" href="#">下载差异报告</a></div><div class="error" id="hqvError"></div>
</div>

<div id="bomcmp-tab-machine-hq-version" class="workflow-shell" style="display:none">
  <div class="workflow-hero"><h4>整机HQ BOM版本对比 <span class="tool-version" data-tool-version="machine-hq-version-compare">v{{ tool_versions['machine-hq-version-compare'] }}</span></h4><p>上传同一整机项目的基准版本和对比版本 HQ BOM，输出差异报告。</p></div>
  <div class="section"><h3>第一步：上传基准版本和对比版本</h3><div class="workflow-step-desc">选择两份整机 HQ BOM，确认 Sheet 和表头行。</div><div class="row"><label>基准版本 BOM：</label><input type="file" id="machvOldFile" accept=".xlsx,.xlsm,.xls" style="width:320px"></div><div class="row"><label>对比版本 BOM：</label><input type="file" id="machvNewFile" accept=".xlsx,.xlsm,.xls" style="width:320px"></div><div class="row"><label>基准版本 Sheet：</label><select id="machvOldSheet" style="width:180px"><option>先选择文件</option></select><label>对比版本 Sheet：</label><select id="machvNewSheet" style="width:180px"><option>先选择文件</option></select><label>表头行：</label><input type="number" id="machvHdr" value="3" min="1" style="width:60px"><button class="btn btn-sm btn-gray" id="machvRefresh" type="button">刷新列</button></div><div id="machvLoadStatus" style="font-size:12px;color:#888"></div></div>
  <div class="section"><h3>第二步：确认比对规则</h3><div class="workflow-step-desc">匹配键用于定位同一物料；下方勾选需要检查变化的字段。</div><div class="plm-info" id="machvRuleSummary">匹配规则：按「料号」匹配同一物料</div><div class="row"><label style="min-width:120px">需要检查变化的字段：</label><button class="btn btn-sm btn-gray" id="machvSelectAll" type="button">全选字段</button><button class="btn btn-sm btn-gray" id="machvSelectNone" type="button">清空字段</button></div><div id="machvCompareCols" class="chk-list" style="max-height:220px"></div><details style="margin-top:10px"><summary style="cursor:pointer;font-size:12px;color:#1a5ad4;font-weight:600">高级设置：修改匹配键</summary><div class="row" style="margin-top:10px"><label>匹配键：</label><select id="machvKeyCol" style="width:220px"><option>先刷新列</option></select><span class="hint">系统导出 HQ BOM 通常使用「料号」。</span></div></details></div>
  <div class="section"><h3>第三步：输出差异报告</h3><button class="btn btn-primary" id="machvRun" type="button">开始比对</button><span id="machvStatus" style="font-size:13px;color:#888;margin-left:8px"></span></div><div class="result" id="machvResult"><span class="title">比对完成</span><br><span id="machvStats" style="display:inline-block;margin-top:6px"></span><br><a class="download" id="machvDl" href="#">下载差异报告</a></div><div class="error" id="machvError"></div>
</div>

<div id="bomcmp-tab-cadence-hq" class="workflow-shell" style="display:none">
  <div class="workflow-hero"><h4>Cadence BOM对比HQ BOM <span class="tool-version" data-tool-version="cadence-hq-compare">v{{ tool_versions['cadence-hq-compare'] }}</span></h4><p>上传 Cadence Archive BOM 导出表和 HQ BOM，按位号、料号、型号、数量或厂商等字段比对差异。</p></div>
  <div class="section"><h3>第一步：上传并预览文件</h3><div class="workflow-step-desc">上传后先检查前 12 行内容。Cadence 标准导出通常会自动识别表头；非标准格式可在预览中点击表头行。</div><div class="row"><label>Cadence BOM：</label><input type="file" id="cadLeftFile" accept=".xlsx,.xlsm,.xls" style="width:320px"></div><div class="row"><label>HQ BOM：</label><input type="file" id="cadRightFile" accept=".xlsx,.xlsm,.xls" style="width:320px"></div><div class="bom-preview-grid"><div><div class="bom-preview-title">Cadence BOM 预览 <span>点击行号选择表头</span></div><div class="table-wrap bom-preview-table"><table><tbody id="cadLeftPreviewRows"><tr><td>上传文件后显示前 12 行</td></tr></tbody></table></div></div><div><div class="bom-preview-title">HQ BOM 预览 <span>标准 HQ/PLM 会自动识别表头</span></div><div class="table-wrap bom-preview-table"><table><tbody id="cadRightPreviewRows"><tr><td>上传文件后显示前 12 行</td></tr></tbody></table></div></div></div></div>
  <div class="section"><h3>第二步：确认 Sheet 和表头行</h3><div class="workflow-step-desc">Cadence 标准导出会优先使用识别到的表头行；手动输入或点击预览行后，点击「加载列」刷新字段列表。</div><div class="row"><label>Cadence Sheet：</label><select id="cadLeftSheet" style="width:180px"><option>先选择文件</option></select><label>Cadence表头行：</label><input type="number" id="cadLeftHdr" value="1" min="1" style="width:60px"><label>HQ Sheet：</label><select id="cadRightSheet" style="width:180px"><option>先选择文件</option></select><label>HQ表头行：</label><input type="number" id="cadRightHdr" value="3" min="1" style="width:60px"><button class="btn btn-sm btn-gray" id="cadRefresh" type="button">加载列</button></div><div id="cadLoadStatus" style="font-size:12px;color:#888"></div></div>
  <div class="section"><h3>第三步：选择匹配键和字段</h3><div class="workflow-step-desc">这里分成两个动作：先选择匹配键定位同一个物料，再选择要检查的差异字段。</div><div class="bom-rule-panel"><h4>3.1 选择匹配键</h4><p>默认优先按料号匹配；需要逐点核对位号时，可以把两边匹配键都改为位号。</p><div class="row"><label>Cadence匹配键：</label><select id="cadLeftKey" style="width:220px"><option>先加载列</option></select><label>HQ匹配键：</label><select id="cadRightKey" style="width:220px"><option>先加载列</option></select></div></div><div class="bom-rule-panel"><h4>3.2 选择需要比对的字段</h4><p>建议保留型号、数量/单耗、位号、生产厂家等字段；未勾选的字段不会进入差异判断。</p><div class="row"><button class="btn btn-sm btn-gray" id="cadSelectAll" type="button">全选同名字段</button><button class="btn btn-sm btn-gray" id="cadSelectNone" type="button">清空同名字段</button><button class="btn btn-sm btn-gray" id="cadAddPair" type="button">添加不同列名字段</button><span class="hint">两边列名不一致时使用，例如 PART_NUMBER 对 料号。</span></div><div id="cadCommonPairs" class="chk-list" style="max-height:180px"></div><div id="cadManualPairs" style="display:flex;flex-direction:column;gap:6px;margin-top:10px"></div></div></div>
  <div class="section"><h3>第四步：导出报告</h3><button class="btn btn-primary" id="cadRun" type="button">开始比对</button><span id="cadStatus" style="font-size:13px;color:#888;margin-left:8px"></span></div><div class="result" id="cadResult"><span class="title">比对完成</span><br><span id="cadStats" style="display:inline-block;margin-top:6px"></span><br><a class="download" id="cadDl" href="#">下载差异报告</a></div><div class="error" id="cadError"></div>
</div>

</script>
