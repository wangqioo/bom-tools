<script type="text/html" id="tpl-plm-auto">
<div style="display:flex;gap:8px;margin-bottom:18px;border-bottom:2px solid #e0e4ef;padding-bottom:0">
  <button class="plm-auto-tab-btn active" type="button" data-pa-tab="spec" style="padding:6px 18px;border:none;background:none;font-size:13px;font-weight:600;color:#1a5ad4;border-bottom:2px solid #1a5ad4;margin-bottom:-2px;cursor:pointer">规格型号反查物料</button>
  <button class="plm-auto-tab-btn" type="button" data-pa-tab="attach" style="padding:6px 18px;border:none;background:none;font-size:13px;font-weight:600;color:#888;border-bottom:2px solid transparent;margin-bottom:-2px;cursor:pointer">HQ附件下载</button>
</div>

<div class="workflow-shell" id="paTabSpec">
  <div class="workflow-hero">
    <h4>规格型号反查物料</h4>
    <p>上传规格型号反查文件，自动登录 EIP/PLM，执行查询并下载“结果导出”文件。</p>
  </div>
  <div class="section"><h3>第一步：填写登录信息</h3>
    <div class="row"><label>账号：</label><input type="text" id="paUser" autocomplete="username" style="width:220px"></div>
    <div class="row"><label>密码：</label><input type="password" id="paPass" autocomplete="current-password" style="width:220px"></div>
  </div>
  <div class="section"><h3>第二步：选择上传文件</h3>
    <div class="row"><label>文件路径：</label><input type="file" id="paFile" accept=".xlsx,.xlsm,.xls" style="width:360px"></div>
  </div>
  <div class="section"><h3>第三步：运行自动化</h3>
    <button class="btn btn-primary" id="paRun">开始自动查询导出</button>
    <span id="paStatus" style="font-size:13px;margin-left:10px;color:#888"></span>
  </div>
  <div class="result" id="paResult">
    <span class="title">导出完成</span>
    <div id="paStats" style="margin-top:6px;font-size:13px"></div>
    <a class="download" id="paDl" href="#">下载 PLM 导出结果</a>
  </div>
  <div class="error" id="paError"></div>
  <div id="paLogBox" style="display:none;margin-top:10px"><h4 style="margin:0 0 6px;font-size:13px">执行日志</h4><pre id="paLog" style="font-size:12px;background:#1a1a2e;color:#e0e0e0;padding:10px;border-radius:6px;max-height:220px;overflow:auto;white-space:pre-wrap;font-family:Consolas,'Courier New',monospace"></pre></div>
</div>

<div class="workflow-shell" id="paTabAttach" style="display:none">
  <div class="workflow-hero">
    <h4>HQ附件下载</h4>
    <p>填写 PLM 登录信息后，可选择单个 HQ 料号下载，或通过 Excel 批量导入 HQ 料号加入下载队列。</p>
  </div>
  <div class="section"><h3>登录信息</h3>
    <div class="row"><label>账号：</label><input type="text" id="paAttUser" autocomplete="username" style="width:220px"></div>
    <div class="row"><label>密码：</label><input type="password" id="paAttPass" autocomplete="current-password" style="width:220px"></div>
  </div>
  <div class="section plm-attach-single"><h3>下载方式一：单个 HQ 料号下载</h3>
    <div class="workflow-step-desc">适合临时查询单个物料。输入 HQ 料号后立即执行下载，进度和结果在本区域内连续展示。</div>
    <div class="row plm-attach-action-row"><label>HQ 料号：</label><input type="text" id="paAttHqpn" placeholder="如 HQ172010044T0" style="width:260px"><button class="btn btn-primary" id="paAttRun">开始下载附件</button><span id="paAttStatus" style="font-size:13px;color:#888"></span></div>
    <div id="paAttProgressPanel" class="plm-auto-progress" style="display:none;margin-top:12px;border:1px solid #b7d4ff;background:#f4f8ff;border-radius:8px;padding:12px 14px">
      <div style="display:flex;justify-content:space-between;gap:12px;align-items:flex-start;margin-bottom:8px">
        <div>
          <div id="paAttProgressStage" style="font-size:14px;font-weight:700;color:#163a6b">等待开始</div>
          <div id="paAttProgressNote" style="font-size:12px;color:#52657d;margin-top:3px">任务启动后会实时刷新当前步骤</div>
        </div>
        <div id="paAttProgressPct" style="font-size:22px;font-weight:800;color:#1a5ad4;min-width:58px;text-align:right">0%</div>
      </div>
      <div style="height:10px;border-radius:999px;background:#dbe8ff;border:1px solid #c6d8f5;overflow:hidden">
        <div id="paAttProgressBar" style="width:0%;height:100%;background:linear-gradient(90deg,#2d6cdf,#2a8a2a);transition:width .2s ease"></div>
      </div>
    </div>
    <div class="result plm-attach-download-result" id="paAttResult">
      <div>
        <span class="title">下载完成</span>
        <div id="paAttStats" style="margin-top:6px;font-size:13px"></div>
      </div>
      <a class="download" id="paAttDl" href="#">下载 PLM 附件</a>
    </div>
  </div>
  <div class="section"><h3>下载方式二：批量 HQ 料号下载</h3>
    <div class="workflow-step-desc">适合一次处理多个物料。上传 Excel，选择 Sheet、表头行和 HQ 料号列后批量加入下载队列。</div>
    <div class="row"><label>Excel：</label><input type="file" id="paAttBatchFile" accept=".xlsx,.xlsm,.xls" style="width:320px"></div>
    <div class="row"><label>Sheet：</label><select id="paAttBatchSheet" style="width:180px"><option>先选择文件</option></select><label>表头行：</label><input type="number" id="paAttBatchHdr" value="1" min="1" style="width:70px"><button class="btn btn-sm btn-gray" id="paAttBatchLoad" type="button">加载 / 刷新</button></div>
    <div class="row"><label>HQ 料号列：</label><select id="paAttBatchCol" style="width:260px"><option>先加载列</option></select><button class="btn btn-primary" id="paAttBatchRun" type="button">批量加入队列</button><span id="paAttBatchStatus" style="font-size:13px;color:#888"></span></div>
    <div id="paAttBatchOverall" style="display:none;margin-top:10px;border:1px solid #b7d4ff;background:#f4f8ff;border-radius:8px;padding:10px 12px">
      <div style="display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:7px"><div><div style="font-size:11px;color:#52657d;font-weight:700;margin-bottom:2px">本次批量总进度</div><div id="paAttBatchStage" style="font-size:13px;font-weight:700;color:#163a6b">等待开始</div></div><div style="display:flex;align-items:center;gap:10px"><button class="btn btn-sm btn-gray" id="paAttBatchCancel" type="button" style="display:none">取消本次批量</button><div id="paAttBatchPct" style="font-size:18px;font-weight:800;color:#1a5ad4">0%</div></div></div>
      <div style="height:9px;border-radius:999px;background:#dbe8ff;border:1px solid #c6d8f5;overflow:hidden"><div id="paAttBatchBar" style="width:0%;height:100%;background:linear-gradient(90deg,#2d6cdf,#2a8a2a);transition:width .2s ease"></div></div>
      <div class="result plm-attach-download-result" id="paAttBatchDownload" style="display:none;margin-top:10px">
        <div>
          <span class="title">批量压缩包已生成</span>
          <div style="margin-top:6px;font-size:13px">本次批量下载结果已汇总为压缩包。</div>
        </div>
        <a class="download" id="paAttBatchDl" href="#">下载本次批量总压缩包</a>
      </div>
    </div>
    <div id="paAttBatchPreview" class="table-wrap" style="display:none;max-height:180px;margin-top:8px"></div>
    <div id="paAttBatchJobs" class="table-wrap" style="display:none;max-height:360px;margin-top:10px"></div>
  </div>
  <div class="error" id="paAttError"></div>
  <div id="paAttLogBox" style="display:none;margin-top:10px"><h4 style="margin:0 0 6px;font-size:13px">执行日志</h4><pre id="paAttLog" style="font-size:12px;background:#1a1a2e;color:#e0e0e0;padding:10px;border-radius:6px;max-height:220px;overflow:auto;white-space:pre-wrap;font-family:Consolas,'Courier New',monospace"></pre></div>
</div>
</script>
