<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BOM Tools · Web 版 v2</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family: -apple-system,'Segoe UI','Microsoft YaHei',sans-serif; display:flex; height:100vh; background:#f0f2f5; }
/* === 左侧导航 === */
.sidebar { width:200px; background:linear-gradient(180deg,#1a2942,#1a3a5c); color:#ccc; display:flex; flex-direction:column; flex-shrink:0; }
.sidebar .logo { padding:18px 16px; font-size:15px; font-weight:700; color:#fff; border-bottom:1px solid rgba(255,255,255,.08); cursor:pointer; }
.sidebar .logo .sub { font-size:11px; font-weight:400; color:#8ab4f8; display:block; margin-top:2px; }
.sidebar nav { flex:1; padding:8px 0; overflow-y:auto; }
.sidebar nav a { display:flex; align-items:center; gap:10px; padding:11px 18px; color:#b0bec5; text-decoration:none; font-size:14px; transition:all .12s; border-left:3px solid transparent; }
.sidebar nav a:hover { background:rgba(255,255,255,.06); color:#e0e0e0; }
.sidebar nav a.active { background:rgba(45,108,223,.25); color:#fff; border-left-color:#4a9eff; font-weight:600; }
.sidebar nav a .icon { font-size:18px; width:24px; text-align:center; }
/* === 主内容 === */
.main { flex:1; display:flex; flex-direction:column; overflow:hidden; }
.toolbar { background:#fff; padding:10px 20px; border-bottom:1px solid #e0e0e0; display:flex; align-items:center; gap:12px; }
.toolbar h2 { font-size:18px; color:#1a3a5c; }
.toolbar .badge { background:#e8f0fe; color:#1a5ad4; padding:3px 10px; border-radius:10px; font-size:11px; }
.content { flex:1; overflow-y:auto; padding:16px 20px; }
/* === 通用组件 === */
.section { background:#fff; border-radius:10px; padding:16px 20px; margin-bottom:12px; box-shadow:0 1px 4px rgba(0,0,0,.06); }
.section h3 { font-size:14px; color:#1a3a5c; margin-bottom:10px; padding-bottom:6px; border-bottom:2px solid #e8f0fe; }
.row { display:flex; gap:10px; align-items:center; margin-bottom:10px; flex-wrap:wrap; }
.row label { font-weight:600; font-size:13px; min-width:65px; color:#444; white-space:nowrap; }
.row .hint { font-size:11px; color:#999; margin-left:4px; }
input[type="text"],input[type="number"],select { padding:7px 10px; border:1px solid #c8ccd0; border-radius:6px; font-size:13px; outline:none; }
input[type="text"]:focus,input[type="number"]:focus,select:focus { border-color:#4a9eff; box-shadow:0 0 0 2px rgba(74,158,255,.12); }
input[type="file"] { font-size:13px; }
.btn { padding:8px 18px; border:none; border-radius:6px; font-size:13px; font-weight:600; cursor:pointer; transition:all .12s; }
.btn-primary { background:#2d6cdf; color:#fff; }
.btn-primary:hover { background:#1a5ad4; }
.btn-primary:disabled { background:#a0bce8; cursor:not-allowed; }
.btn-outline { background:#fff; color:#2d6cdf; border:1px solid #2d6cdf; }
.btn-outline:hover { background:#e8f0fe; }
.btn-sm { padding:4px 12px; font-size:12px; }
.btn-gray { background:#f0f2f5; color:#555; border:1px solid #d0d5dd; }
.btn-gray:hover { background:#e0e4e8; }
.btn-green { background:#2a8a2a; color:#fff; }
.btn-green:hover { background:#227322; }
/* === 结果区 === */
.result { display:none; background:#f0fdf0; border:1px solid #a3d9a3; border-radius:8px; padding:14px 18px; margin-top:12px; }
.result.show { display:block; }
.result .title { color:#2a8a2a; font-weight:700; font-size:14px; }
.result .download { display:inline-block; margin-top:8px; background:#2a8a2a; color:#fff; padding:8px 18px; border-radius:6px; text-decoration:none; font-weight:600; font-size:13px; }
.result .download:hover { background:#227322; }
.error { display:none; background:#fff0f0; color:#c00000; padding:12px 16px; border-radius:8px; margin-top:12px; border:1px solid #f0c0c0; }
.error.show { display:block; }
/* === 表格 === */
table { width:100%; border-collapse:collapse; font-size:12px; margin-top:8px; }
th { background:#f0f2f5; padding:8px 6px; text-align:left; font-weight:600; border-bottom:2px solid #d0d5dd; position:sticky; top:0; white-space:nowrap; }
td { padding:7px 6px; border-bottom:1px solid #e8eaed; white-space:nowrap; }
tr:hover td { background:#f7f9fc; }
.table-wrap { max-height:320px; overflow:auto; border:1px solid #e0e0e0; border-radius:6px; }
/* === Tab 切换 === */
.tabs { display:flex; gap:0; border-bottom:2px solid #d0d5dd; margin-bottom:16px; }
.tab-btn { padding:8px 20px; background:#f5f7fa; border:1px solid #d0d5dd; border-bottom:none; border-radius:6px 6px 0 0; cursor:pointer; font-size:14px; font-weight:500; color:#666; margin-bottom:-2px; position:relative; }
.tab-btn.active { background:#fff; color:#1a5ad4; border-color:#1a5ad4; }
.tab-btn:hover { background:#eef2f7; }
.tab-content { display:none; }
.tab-content.active { display:block; }
/* === 树形列表（飞书表格库） === */
.tree-list { border:1px solid #e0e0e0; border-radius:6px; max-height:420px; overflow-y:auto; background:#fff; }
.tree-item { display:flex; align-items:center; padding:7px 12px; cursor:pointer; font-size:13px; border-bottom:1px solid #f0f0f0; gap:8px; }
.tree-item:hover { background:#f7f9fc; }
.tree-item.selected { background:#e8f0fe; color:#1a5ad4; font-weight:600; }
.tree-item .indent { width:16px; flex-shrink:0; }
.tree-cat { font-weight:700; font-size:12px; color:#1a5fa8; padding:6px 12px; background:#f0f5fd; border-bottom:1px solid #d0ddf0; cursor:default; }
.tree-cat.alt { color:#7a3a9a; background:#f8f0ff; border-bottom-color:#e0d0f0; }
.badge-sm { display:inline-block; padding:1px 8px; border-radius:8px; font-size:10px; font-weight:600; }
.badge-green { background:#e8f5e9; color:#2a8a2a; }
.badge-orange { background:#fff3e0; color:#e07000; }
.badge-gray { background:#f0f0f0; color:#888; }
.badge-blue { background:#e8f0fe; color:#2d6cdf; }
/* === checkbox list === */
.chk-list { display:flex; flex-wrap:wrap; gap:3px; max-height:160px; overflow-y:auto; padding:6px; border:1px solid #e0e0e0; border-radius:6px; }
.chk-list label { display:inline-flex; align-items:center; gap:3px; padding:2px 8px; font-size:12px; cursor:pointer; border-radius:4px; white-space:nowrap; }
.chk-list label:hover { background:#f0f2f5; }
/* === 详情面板 === */
.detail-panel { background:#fafbfc; border:1px solid #e0e0e0; border-radius:6px; padding:14px; font-size:13px; }
.detail-panel h4 { font-size:14px; margin-bottom:8px; }
/* === 概览卡片 === */
.overview-grid { display:grid; grid-template-columns:1fr; gap:12px; animation:fadeIn .25s ease; }
@keyframes fadeIn { from{opacity:0;transform:translateY(8px)} to{opacity:1;transform:translateY(0)} }
.overview-card { display:flex; align-items:flex-start; gap:18px; background:#fff; border-radius:12px; padding:20px 22px; box-shadow:0 1px 4px rgba(0,0,0,.06); cursor:pointer; transition:all .15s; border:1px solid transparent; }
.overview-card:hover { box-shadow:0 4px 16px rgba(0,0,0,.1); border-color:#4a9eff; transform:translateY(-1px); }
.overview-card .oc-icon { font-size:36px; width:44px; text-align:center; flex-shrink:0; margin-top:2px; }
.overview-card .oc-body { flex:1; min-width:0; }
.overview-card .oc-title { font-size:16px; font-weight:700; color:#1a3a5c; margin-bottom:6px; }
.overview-card .oc-badge { display:inline-block; font-size:11px; font-weight:600; background:#e8f0fe; color:#1a5ad4; padding:1px 8px; border-radius:8px; vertical-align:middle; margin-left:6px; }
.overview-card .oc-desc { font-size:13px; color:#666; line-height:1.6; }
/* === 加载遮罩 === */
.spinner { display:inline-block; animation:spin .8s linear infinite; }
@keyframes spin { 100% { transform:rotate(360deg); } }
</style>
</head>
<body>

<!-- ===== 左侧导航 ===== -->
<aside class="sidebar">
  <div class="logo" onclick="showOverview()">🛠 BOM Tools<span class="sub">硬件设计辅助平台 v2</span></div>
  <nav>
    <a href="#" data-tool="bom"><span class="icon">📋</span>BOM 格式转换</a>
    <a href="#" data-tool="feishu"><span class="icon">🔍</span>飞书优选库+关系库匹配</a>
    <a href="#" data-tool="plm"><span class="icon">📤</span>转换为上传PLM系统格式</a>
  </nav>
</aside>

<!-- ===== 主内容区 ===== -->
<div class="main">
  <div class="toolbar">
    <h2 id="toolTitle">BOM Tools</h2>
    <span class="badge" id="toolBadge">硬件设计辅助平台</span>
  </div>
  <div class="content" id="contentArea"></div>
</div>

<!-- ===== 隐藏模板 ===== -->

<!-- ── BOM 工具 ── -->
<script type="text/html" id="tpl-bom">
<div class="section"><h3>第一步：选择文件</h3>
  <div class="row"><label>文件路径：</label><input type="file" id="bomFile" accept=".xlsx,.xlsm,.xls" style="width:320px"><button class="btn btn-outline btn-sm" id="bomBrowse">浏览...</button></div>
  <div class="row"><label>Sheet：</label><select id="bomSheet" style="width:180px"><option>先选择文件</option></select><label>表头行：</label><input type="number" id="bomHdr" value="1" min="1" style="width:60px"><button class="btn btn-sm btn-gray" id="bomRefresh">刷新预览</button></div>
  <div id="bomPreview" class="table-wrap" style="margin-top:8px"></div>
</div>
<div class="section"><h3>第二步：列映射（自动识别，可手动调整）</h3>
  <div class="row">
    <label>格式：</label>
    <select id="bomFmt">
      <option value="A">格式A — 品牌型号合并列（|| 或空格分隔，如 MURATA:GRM188||SAMSUNG:CL10）</option>
      <option value="B">格式B — 厂家/型号分开列，分号分隔（如 YAGEO;KOA / RC0805;RK73）</option>
      <option value="C">格式C — 制造商含编号，冒号分隔（如 1630-大毅科技[全称]:0362-RALEC[全称]）</option>
    </select>
  </div>
  <div class="row">
    <label>物料名称列：</label><input type="text" id="bomColName" style="width:80px" placeholder="如 C">
    <label>用量列：</label><input type="text" id="bomColQty" style="width:80px" placeholder="如 D">
    <label>品牌/厂家列：</label><input type="text" id="bomColBrand" style="width:80px" placeholder="如 E">
    <label>型号列：</label><input type="text" id="bomColModel" style="width:80px" placeholder="如 F">
    <span class="hint">（填写列字母，格式A无需填型号列）</span>
  </div>
  <div id="bomDetected" style="font-size:12px;color:#555;background:#f7f9fc;padding:8px;border-radius:6px;margin-top:4px"></div>
</div>
<div class="section"><h3>第三步：输出设置</h3>
  <div class="row">
    <label>输出模式：</label>
    <select id="bomOutputMode">
      <option value="expand">原格式展开（保留原列，供应商拆多行，新增厂商/型号/是否独供列）</option>
      <option value="hq">HQ 整机BOM配置表（绿色表头，含序号/HQ PN/厂商型号/主二供/用量）</option>
    </select>
  </div>
  <div class="row" id="bomProjRow" style="display:none"><label>项目名称：</label><input type="text" id="bomProjName" style="width:240px" placeholder="写入BOM表头（可留空）"></div>
  <button class="btn btn-primary" id="bomRun">⚡ 开始转换</button> <span id="bomStatus" style="font-size:13px;color:#888"></span>
</div>
<div class="result" id="bomResult"><span class="title">✅ 转换完成</span><br><span id="bomStats" style="display:inline-block;margin-top:6px"></span><br><a class="download" id="bomDl" href="#">📥 下载结果文件</a></div>
<div class="error" id="bomError"></div>
</script>

<!-- ── PLM 工具 ── -->
<script type="text/html" id="tpl-plm">
<div class="section"><h3>第一步：选择整机BOM配置表</h3>
  <div class="row"><label>文件路径：</label><input type="file" id="plmFile" accept=".xlsx,.xlsm,.xls" style="width:320px"><button class="btn btn-outline btn-sm" id="plmBrowse">浏览...</button></div>
  <div class="row"><label>Sheet：</label><select id="plmSheet" style="width:180px"><option>先选择文件</option></select><label>表头行：</label><input type="text" id="plmHdr" value="4" style="width:50px"><button class="btn btn-sm btn-gray" id="plmRefresh">加载 / 刷新</button></div>
</div>
<div class="section"><h3>第二步：列映射（自动识别，可手动填列字母覆盖）</h3>
  <div id="plmDetectLog" style="font-size:12px;color:#555;background:#f7f9fc;padding:8px;border-radius:6px;margin-bottom:8px"></div>
  <div id="plmColMap" class="table-wrap" style="margin-bottom:10px;max-height:200px"></div>
  <div class="row">
    <label>HQ PN 列：</label><input type="text" id="plmColHqpn" style="width:60px" placeholder="如 E">
    <label>主二供列：</label><input type="text" id="plmColStype" style="width:60px" placeholder="如 I">
    <label>用量列：</label><input type="text" id="plmColQty" style="width:60px" placeholder="如 K">
  </div>
</div>
<div class="section"><h3>第三步：输出设置</h3>
  <div class="row"><label>项目配置名：</label><input type="text" id="plmProjName" style="width:240px" placeholder="写入PLM文件头部（可留空）"></div>
  <button class="btn btn-primary" id="plmRun">⚡ 开始转换</button> <span id="plmStatus" style="font-size:13px;color:#888"></span>
</div>
<div class="result" id="plmResult"><span class="title">✅ 转换完成</span><br><span id="plmStats" style="display:inline-block;margin-top:6px"></span><br><a class="download" id="plmDl" href="#">📥 下载 PLM 导入文件</a></div>
<div class="error" id="plmError"></div>
<div id="plmLogBox" style="display:none;margin-top:10px"><h4 style="margin:0 0 6px;font-size:13px">📋 处理日志</h4><pre id="plmLog" style="font-size:12px;background:#1a1a2e;color:#e0e0e0;padding:10px;border-radius:6px;max-height:200px;overflow:auto;white-space:pre-wrap;font-family:Consolas,'Courier New',monospace"></pre></div>
</script>

<!-- ── 飞书工具 ── -->
<script type="text/html" id="tpl-feishu">
<div class="section"><h3>网关设置</h3>
  <div class="row">
    <label>网关地址：</label><input type="text" id="fsBaseUrl" value="https://mcenter.huaqin.com" style="width:260px">
    <label>Origin：</label><input type="text" id="fsOrigin" value="cli_a96ac38049f8d0e5" style="width:200px">
    <label>工号：</label><input type="text" id="fsUserId" value="" style="width:110px" placeholder="如 100448405">
  </div>
  <div style="font-size:11px;color:#888" id="fsCfgStatus"></div>
</div>
<div class="section"><h3>本地 BOM 文件</h3>
  <div class="row">
    <label>文件路径：</label><input type="file" id="fsFile" accept=".xlsx,.xlsm,.xls" style="width:300px">
    <label>Sheet：</label><select id="fsSheet" style="width:180px"><option>先选择文件</option></select>
    <span class="hint">（一次只能匹配一个 Sheet）</span>
    <label>表头行：</label><input type="number" id="fsHdr" value="1" min="1" style="width:60px">
  </div>
</div>
<div class="section"><h3>表格库</h3>
  <div class="row">
    <button class="btn btn-sm btn-gray" id="fsReloadTables">⟳ 刷新表格列表</button>
    <span id="fsReloadHint" class="hint"></span>
    <button class="btn btn-sm btn-gray" id="fsBatchUpdate" style="margin-left:8px">⟳ 一键缓存全部启用表格</button>
    <span id="fsBatchHint" class="hint"></span>
    <button class="btn btn-sm btn-gray" id="fsClearConfig" style="margin-left:8px;color:#c00000">🗑 清除本地配置</button>
  </div>
  <div style="display:flex;gap:12px">
    <div style="width:240px;flex-shrink:0">
      <div class="tree-list" id="fsTreeList"></div>
    </div>
    <div class="detail-panel" style="flex:1" id="fsDetail">
      <span style="color:#888">← 点击左侧表格查看详情</span>
    </div>
  </div>
</div>
<div class="section"><h3>列映射</h3>
  <div class="row"><label>配置表格：</label><select id="fsMapTable" style="width:220px"><option>请先在表格库加载数据</option></select><button class="btn btn-sm btn-gray" id="fsMapRefresh" style="margin-left:4px">刷新</button></div>
  <div class="section" style="background:#fafbfc;margin-bottom:0"><h3>匹配键（AND 逻辑，第1对必填）</h3>
    <div class="row"><label style="color:#c00000">第1对：</label>本地 <input type="text" id="fsLk1" style="width:160px" placeholder="本地列名"> ↔ 飞书 <input type="text" id="fsFk1" style="width:160px" placeholder="飞书列名"></div>
    <div class="row"><label>第2对：</label>本地 <input type="text" id="fsLk2" style="width:160px" placeholder="可选"> ↔ 飞书 <input type="text" id="fsFk2" style="width:160px" placeholder="可选"> <button class="btn btn-sm btn-gray" id="fsClear2">清除</button></div>
    <div class="row"><label>第3对：</label>本地 <input type="text" id="fsLk3" style="width:160px" placeholder="可选"> ↔ 飞书 <input type="text" id="fsFk3" style="width:160px" placeholder="可选"> <button class="btn btn-sm btn-gray" id="fsClear3">清除</button></div>
  </div>
  <div style="margin-top:10px"><b>要提取的列：</b> <button class="btn btn-sm btn-gray" id="fsSelAll">全选</button> <button class="btn btn-sm btn-gray" id="fsSelNone">全不选</button></div>
  <div class="chk-list" id="fsChkList" style="margin-top:6px"></div>
  <button class="btn btn-sm btn-primary" id="fsSaveMap" style="margin-top:8px">保存此表格列映射配置</button> <span id="fsSaveHint" class="hint"></span>
  <div id="fsMapWarn" style="color:#c00000;font-size:12px;margin-top:4px"></div>
</div>
<div class="section"><h3>运行匹配</h3>
  <div id="fsRunStatus" style="font-size:12px;color:#888;margin-bottom:8px"></div>
  <button class="btn btn-primary" id="fsRun">⚡ 开始匹配</button>
  <span id="fsRunStatus2" style="font-size:13px;color:#888;margin-left:8px"></span>
</div>
<div class="result" id="fsResult"><span class="title">✅ 匹配完成</span><br><span id="fsStats" style="display:inline-block;margin-top:6px"></span><br><a class="download" id="fsDl" href="#">📥 下载匹配结果</a></div>
<div class="error" id="fsError"></div>
<div id="fsLogBox" style="display:none;margin-top:10px"><h4 style="margin:0 0 6px;font-size:13px">📋 处理日志</h4><pre id="fsLog" style="font-size:12px;background:#1a1a2e;color:#e0e0e0;padding:10px;border-radius:6px;max-height:200px;overflow:auto;white-space:pre-wrap;font-family:Consolas,'Courier New',monospace"></pre></div>
</script>

<script>
// ═══════════════════ 通用函数 ═══════════════════
function $(id){return document.getElementById(id);}
function show(el){el.style.display='block';}
function hide(el){el.style.display='none';}

// ═══════════════════ 左侧导航切换 ═══════════════════
const TOOLS = {
  bom:    {title:'BOM 格式转换',        badge:'v5.10', tpl:'tpl-bom',
           desc:'将客户提供的多种格式 BOM 表自动识别列映射，支持品牌型号合并列/分开列（格式A/B/C），展开为多供应商独立行，或输出 HQ 标准整机BOM配置表。'},
  feishu: {title:'飞书优选库+关系库匹配', badge:'v3.0',  tpl:'tpl-feishu',
           desc:'连接飞书内部 API 网关，支持 15 个预置库（优选库 + 对应关系库），多键 AND 匹配（最多 3 对），批量提取字段，输出含来源表格的匹配结果。'},
  plm:    {title:'转换为上传PLM系统格式', badge:'v1.6',  tpl:'tpl-plm',
           desc:'将整机 BOM 配置表转换为 PLM 系统可导入的标准格式：序号、料号、单耗等25列，主供行填单耗，替代料自动标记主辅BOM标记。'},
};
let curTool = null;

function showOverview(){
  curTool = null;
  document.querySelectorAll('.sidebar nav a').forEach(x=>x.classList.remove('active'));
  $('toolTitle').textContent = 'BOM Tools';
  $('toolBadge').textContent = '硬件设计辅助平台';
  let html = '<div class="overview-grid">';
  for(const [key, t] of Object.entries(TOOLS)){
    const iconEl = document.querySelector('.sidebar nav a[data-tool="'+key+'"] .icon');
    const icon = iconEl ? iconEl.textContent : '🛠';
    html += '<div class="overview-card" onclick="switchTool(\''+key+'\')">' +
      '<div class="oc-icon">'+icon+'</div>' +
      '<div class="oc-body">' +
        '<div class="oc-title">'+t.title+' <span class="oc-badge">'+t.badge+'</span></div>' +
        '<div class="oc-desc">'+t.desc+'</div>' +
      '</div></div>';
  }

function updateBomPreview(headers, previewRows){
  if(!headers||!headers.length){$('bomPreview').innerHTML='';return;}
  let h='<table>';
  // 列字母行
  h+='<tr style="background:#e8f0fe">';
  headers.forEach((_,ci)=>h+=`<th style="color:#1a5ad4;font-size:11px;font-weight:700;padding:2px 6px">${String.fromCharCode(65+ci)}</th>`);
  h+='</tr>';
  // 表头行
  h+='<tr>';
  headers.forEach(hd=>h+=`<th>${hd||''}</th>`);
  h+='</tr>';
  // 数据行
  (previewRows||[]).forEach(r=>{
    h+='<tr>';
    r.forEach(c=>h+=`<td>${c||''}</td>`);
    h+='</tr>';
  });
  h+='</table>';
  $('bomPreview').innerHTML=h;
}

function updateBomFromApi(d){
  if(!d.success) return;
  let opts='';
  d.sheets.forEach(s=>opts+=`<option${s===d.current_sheet?' selected':''}>${s}</option>`);
  $('bomSheet').innerHTML=opts;
  if(d.detected){
    if(d.detected.name)  $('bomColName').value=d.detected.name;
    if(d.detected.qty)   $('bomColQty').value=d.detected.qty;
    if(d.detected.brand) $('bomColBrand').value=d.detected.brand;
    if(d.detected.model) $('bomColModel').value=d.detected.model;
  }
  // Format guess
  if(d.fmt_guess){
    const sel=$('bomFmt');
    for(let i=0;i<sel.options.length;i++){
      if(sel.options[i].value===d.fmt_guess){sel.selectedIndex=i;break;}
    }
  }
  $('bomDetected').textContent='自动识别：'+JSON.stringify(d.detected||{});
  updateBomPreview(d.headers, d.preview);
}

// ─── 飞书匹配 ─────────────────────────────────────────
const FS_TABLES = {{ preset_tables | tojson }};
let fsTables = FS_TABLES.map((t,i)=>({
  ...t, idx:i,
  _sheets:[], _headers:[], _connected:false, _loaded:false,
  enabled:false, active_sheet_ids:[],
  local_key_names:['','',''], feishu_key_names:['','',''], fetch_col_names:[],
  cache_key:'', cache_row_count:0, cache_fetched_at:0,
  _cache_sheet_counts:{}, _cache_stale:false,
}));
let fsCurIdx = null;

// ─── localStorage 持久化 ──────────────────────────────
const _FS_KEY = 'bom-tools-feishu-v1';

function fsSaveConfig(){
  const bu=$('fsBaseUrl'), or_=$('fsOrigin'), ui=$('fsUserId');
  const prev = window._fsSavedCfg || {};
  const cfg = {
    base_url: bu ? bu.value : prev.base_url||'',
    origin:  or_ ? or_.value : prev.origin||'',
    user_id:  ui ? ui.value  : prev.user_id||'',
    tables: fsTables.map(t=>({
      idx:t.idx, token:t.token||'', enabled:t.enabled,
      active_sheet_ids:t.active_sheet_ids||[],
      local_key_names:t.local_key_names||['','',''],
      feishu_key_names:t.feishu_key_names||['','',''],
      fetch_col_names:t.fetch_col_names||[],
      _sheets:t._sheets||[], _headers:t._headers||[],
      _connected:!!t._connected, _loaded:!!t._loaded,
      cache_key:t.cache_key||'', cache_row_count:t.cache_row_count||0,
      cache_fetched_at:t.cache_fetched_at||0,
      _cache_sheet_counts:t._cache_sheet_counts||{},
    })),
  };
  try{ localStorage.setItem(_FS_KEY, JSON.stringify(cfg)); window._fsSavedCfg=cfg; }catch(e){}
}

function fsClearConfig(){
  if(!confirm('确认清除所有飞书本地配置？（含 Token、列映射、缓存记录）')) return;
  try{ localStorage.removeItem(_FS_KEY); }catch(e){}
  window._fsSavedCfg = null;
  // reset fsTables
  fsTables = FS_TABLES.map((t,i)=>({
    ...t, idx:i,
    _sheets:[], _headers:[], _connected:false, _loaded:false,
    enabled:false, active_sheet_ids:[],
    local_key_names:['','',''], feishu_key_names:['','',''], fetch_col_names:[],
    cache_key:'', cache_row_count:0, cache_fetched_at:0,
  }));
  renderFsTrees();
  $('fsCfgStatus').textContent='配置已清除';
}

// 页面加载时预读配置并合并到 fsTables
(function(){
  try{
    const raw = localStorage.getItem(_FS_KEY);
    if(!raw) return;
    const cfg = JSON.parse(raw);
    window._fsSavedCfg = cfg;
    if(cfg.tables){
      cfg.tables.forEach(st=>{
        const t = fsTables[st.idx]; if(!t) return;
        t.token           = st.token || t.token || '';
        t.enabled         = !!st.enabled;
        t.active_sheet_ids= st.active_sheet_ids || [];
        t.local_key_names = st.local_key_names  || ['','',''];
        t.feishu_key_names= st.feishu_key_names || ['','',''];
        t.fetch_col_names = st.fetch_col_names  || [];
        t._sheets         = st._sheets  || [];
        t._headers        = st._headers || [];
        t._connected      = !!st._connected;
        t._loaded         = !!st._loaded;
        t.cache_key          = st.cache_key          || '';
        t.cache_row_count    = st.cache_row_count    || 0;
        t.cache_fetched_at   = st.cache_fetched_at   || 0;
        t._cache_sheet_counts= st._cache_sheet_counts|| {};
        t._cache_stale       = false;  // re-evaluated on next connect
      });
    }
  }catch(e){}
}());

  // 恢复网关配置
  const saved = window._fsSavedCfg;
  if(saved){
    if(saved.base_url) $('fsBaseUrl').value = saved.base_url;

    if(saved.user_id)  $('fsUserId').value  = saved.user_id;

  $('fsReloadTables').onclick=renderFsTrees;
  $('fsBatchUpdate').onclick=fsBatchUpdate;
  $('fsClearConfig').onclick=fsClearConfig;

  $('fsSelNone').onclick=()=>document.querySelectorAll('.fs-chk-col').forEach(cb=>cb.checked=false);

      if(!d.success)return;
      window._fsLocalHeaders=d.headers||[];

      (d.sheets||[]).forEach(s=>{

function _fmtTime(ts){
  if(!ts) return '';
  const d=new Date(ts*1000);
  return `${d.getMonth()+1}/${d.getDate()} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
}

function renderFsTrees(){
  const cats={'优选库':[],'对应关系库':[]};
  fsTables.forEach(t=>{const c=t.category||'优选库';(cats[c]=cats[c]||[]).push(t);});
  let h='';
  for(const [cat,ts] of Object.entries(cats)){
    if(!ts.length)continue;
    h+=`<div class="tree-cat${cat==='对应关系库'?' alt':''}">▸ ${cat}</div>`;
    ts.forEach(t=>{
      // 加载状态：✓=已缓存且最新  ⚠=已缓存但线上数据已变  ◎=仅获取列名  —=未连接
      const ld = t.cache_key ? (t._cache_stale?'⚠':'✓') : (t._connected||t._loaded?'◎':'—');
      const mt = t.enabled&&t.cache_key?'●':t.enabled?'！':'○';
      const ldCls = t.cache_key ? (t._cache_stale?'badge-orange':'badge-green') : (t._connected||t._loaded?'badge-blue':'badge-gray');
      const mtCls = t.enabled&&t.cache_key?'badge-green':t.enabled?'badge-orange':'badge-gray';
      const cacheHint = t.cache_key&&t.cache_row_count ? ` <span style="font-size:10px;color:#888">${t.cache_row_count}行</span>` : '';
      h+=`<div class="tree-item" data-idx="${t.idx}" onclick="fsSelectTable(${t.idx})">
        <span class="indent"></span><span style="flex:1">${t.name}${cacheHint}</span>
        <span class="badge-sm ${ldCls}">${ld}</span>
        <span class="badge-sm ${mtCls}">${mt}</span>
      </div>`;
    });
  }
  $('fsTreeList').innerHTML=h;
  renderFsMapTable();
}

function fsSelectTable(idx){
  fsCurIdx=idx;
  const t=fsTables[idx];
  document.querySelectorAll('#fsTreeList .tree-item').forEach(el=>el.classList.toggle('selected',parseInt(el.dataset.idx)===idx));
  let h=`<h4>${t.name} <span style="font-size:11px;color:#888;font-weight:400">(${t.category||'优选库'})</span></h4>`;
  h+=`<div class="row"><label>名称：</label><input type="text" id="fsDetName" value="${t.name}" style="width:160px">
    <label>Token：</label><input type="text" id="fsDetToken" value="${t.token||''}" style="width:260px">
    <label>启用：</label><input type="checkbox" id="fsDetEnable" ${t.enabled?'checked':''} onchange="fsTables[${idx}].enabled=this.checked;renderFsTrees();fsSaveConfig()"></div>`;
  h+=`<div class="row">
    <button class="btn btn-sm btn-primary" onclick="fsConnectTable(${idx})">连接并获取 Sheet 列表</button>
    <button class="btn btn-sm btn-green"   onclick="fsCacheTable(${idx})">⬇ 加载并缓存全部数据</button>
  </div>`;
  if(t._sheets.length){
    h+=`<div style="margin-top:8px"><b>Sheet 选择（可多选）：</b></div><div class="chk-list" style="max-height:200px">`;
    t._sheets.forEach(s=>{
      const ckd=t.active_sheet_ids.includes(s.sheetId)?'checked':'';
      h+=`<label><input type="checkbox" value="${s.sheetId}" ${ckd} onchange="fsToggleSheet(${idx},'${s.sheetId}',this.checked)"> ${s.title}</label>`;
    });
    h+='</div>';
  }
  const cacheInfo = t.cache_key
    ? (t._cache_stale
        ? `<span style="color:#c07000">⚠ 线上行数已变化，缓存可能过期（${_fmtTime(t.cache_fetched_at)}，${t.cache_row_count} 行）——建议重新缓存</span>`
        : `<span style="color:#2a8a2a">✓ 已缓存 ${t.cache_row_count} 行数据（${_fmtTime(t.cache_fetched_at)}）</span>`)
    : '<span style="color:#e07000">无服务端缓存，匹配时将实时拉取（较慢）</span>';
  const connInfo = t._loaded
    ? `已连接并获取列标题（${t._headers.length} 列）`
    : t._connected ? '已连接' : '未连接';
  h+=`<div style="margin-top:6px;font-size:12px">${cacheInfo}<br><span style="color:#888">${connInfo}</span></div>`;
  $('fsDetail').innerHTML=h;
}

function fsToggleSheet(idx,sid,val){
  const t=fsTables[idx];
  if(val){if(!t.active_sheet_ids.includes(sid))t.active_sheet_ids.push(sid);}
  else t.active_sheet_ids=t.active_sheet_ids.filter(x=>x!==sid);
  fsSaveConfig();
}

async function fsConnectTable(idx){
  const t=fsTables[idx];
  const tokenEl=$('fsDetToken');
  if(tokenEl)t.token=tokenEl.value.trim();
  if(!t.token){alert('请先填写 Token');return;}
  const btns=$('fsDetail').querySelectorAll('button');btns.forEach(b=>b.disabled=true);
  try{
    const r=await fetch('/api/feishu/sheets',{method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({base_url:$('fsBaseUrl').value,origin:$('fsOrigin').value,user_id:$('fsUserId').value,token:t.token})});
    const d=await r.json();
    if(d.success){
      t._sheets=d.sheets;t._connected=true;
      if(!t.active_sheet_ids.length)t.active_sheet_ids=d.sheets.map(s=>s.sheetId);
      // 连接时顺带返回表头
      if(d.headers&&d.headers.length){
        t._headers=d.headers.filter(h=>h);
        t._loaded=true;
        let dl='';t._headers.forEach(h=>dl+=`<option value="${h}">`);
        ['fsFk1','fsFk2','fsFk3'].forEach(id=>{
          let el=document.getElementById(id+'_flist');
          if(!el){el=document.createElement('datalist');el.id=id+'_flist';document.body.appendChild(el);}
          el.innerHTML=dl;
          const inp=document.getElementById(id);if(inp)inp.setAttribute('list',id+'_flist');
        });
      }
      // 检测缓存是否与线上一致（行数比对）
      if(t.cache_key && Object.keys(t._cache_sheet_counts||{}).length>0){
        const live={};d.sheets.forEach(s=>live[s.sheetId]=s.rowCount||0);
        t._cache_stale=Object.entries(t._cache_sheet_counts).some(
          ([sid,cnt])=>t.active_sheet_ids.includes(sid)&&live[sid]!==undefined&&live[sid]!==cnt
        );
      } else {
        t._cache_stale=false;
      }
      fsSelectTable(idx);renderFsTrees();renderFsMapTable();fsSaveConfig();
    } else alert(d.error);
  }catch(e){alert(e.message);}
  btns.forEach(b=>b.disabled=false);
}

// 加载并缓存全部数据到服务端（用于匹配）
async function fsCacheTable(idx){
  const t=fsTables[idx];
  if(!t.token){alert('请先填写并连接 Token');return;}
  const btns=$('fsDetail').querySelectorAll('button');btns.forEach(b=>b.disabled=true);
  const statusEl=$('fsDetail').querySelector('div[style*="margin-top:6px"]');
  if(statusEl) statusEl.innerHTML='<span style="color:#888">⏳ 正在拉取全部数据，请稍候...</span>';
  try{
    const r=await fetch('/api/feishu/load',{method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({base_url:$('fsBaseUrl').value,origin:$('fsOrigin').value,user_id:$('fsUserId').value,
        token:t.token,active_sheet_ids:t.active_sheet_ids})});
    const d=await r.json();
    if(d.success){
      t.cache_key            = d.cache_key;
      t.cache_row_count      = d.row_count;
      t.cache_fetched_at     = d.fetched_at;
      t._cache_sheet_counts  = d.sheet_counts || {};
      t._cache_stale         = false;  // 刚缓存，肯定最新
      if(d.headers&&d.headers.length){ t._headers=d.headers.filter(h=>h); t._loaded=true; }
      fsSelectTable(idx);renderFsTrees();renderFsMapTable();fsSaveConfig();
    } else { alert('缓存失败：'+d.error); fsSelectTable(idx); }
  }catch(e){alert(e.message);fsSelectTable(idx);}
  btns.forEach(b=>b.disabled=false);
}

// 一键缓存所有启用的表格
async function fsBatchUpdate(){
  $('fsBatchUpdate').disabled=true;$('fsBatchHint').textContent='缓存中...';
  let count=0;
  for(let i=0;i<fsTables.length;i++){
    const t=fsTables[i];
    if(!t.enabled||!t.token)continue;
    $('fsBatchHint').textContent=`缓存中 (${count+1})：${t.name}`;
    try{
      if(!t._connected) await fsConnectTable(i);
      await fsCacheTable(i);
      count++;
    }catch(e){console.error(e);}
  }
  $('fsBatchUpdate').disabled=false;$('fsBatchHint').textContent=`✓ 完成 ${count} 个`;
  renderFsTrees();
}

function renderFsMapTable(){
  const loaded=fsTables.filter(t=>t._loaded);
  let opts='<option value="">请选择已加载表格</option>';
  loaded.forEach(t=>opts+=`<option value="${t.idx}">${t.name}（${t._headers.length} 列）</option>`);
  $('fsMapTable').innerHTML=opts;
}

function fsOnMapTableChange(){
  const idx=parseInt($('fsMapTable').value);if(isNaN(idx))return;
  const t=fsTables[idx];
  $('fsLk1').value=t.local_key_names[0]||'';$('fsFk1').value=t.feishu_key_names[0]||'';
  $('fsLk2').value=t.local_key_names[1]||'';$('fsFk2').value=t.feishu_key_names[1]||'';
  $('fsLk3').value=t.local_key_names[2]||'';$('fsFk3').value=t.feishu_key_names[2]||'';
  let h='';
  (t._headers||[]).forEach(col=>{
    if(!col)return;
    const ckd=t.fetch_col_names.includes(col)?'checked':'';
    h+=`<label><input type="checkbox" value="${col}" ${ckd} class="fs-chk-col"> ${col}</label>`;
  });
  $('fsChkList').innerHTML=h;
  // Update feishu key datalists
  let dl='';(t._headers||[]).forEach(h=>dl+=`<option value="${h}">`);
  ['fsFk1','fsFk2','fsFk3'].forEach(id=>{
    let el=document.getElementById(id+'_flist');
    if(!el){el=document.createElement('datalist');el.id=id+'_flist';document.body.appendChild(el);}
    el.innerHTML=dl;$(id).setAttribute('list',id+'_flist');
  });
}

function fsSaveMapping(){
  const idx=parseInt($('fsMapTable').value);if(isNaN(idx)){alert('请先选择表格');return;}
  const t=fsTables[idx];
  t.local_key_names=[$('fsLk1').value,$('fsLk2').value,$('fsLk3').value];
  t.feishu_key_names=[$('fsFk1').value,$('fsFk2').value,$('fsFk3').value];
  t.fetch_col_names=[];
  document.querySelectorAll('.fs-chk-col:checked').forEach(cb=>t.fetch_col_names.push(cb.value));
  fsSaveConfig();
  $('fsSaveHint').textContent='✓ 已保存';setTimeout(()=>$('fsSaveHint').textContent='',2000);
}

async function fsRunMatch(){
  const f=$('fsFile').files[0];if(!f){alert('请先上传 BOM 文件');return;}
  const enabled=fsTables.filter(t=>t.enabled&&t.token);
  if(!enabled.length){alert('请先在表格库中启用至少一个表格');return;}

  $('fsRun').disabled=true;$('fsBatchUpdate').disabled=true;
  $('fsRunStatus2').textContent='匹配中...';
  hide($('fsResult'));hide($('fsError'));hide($('fsLogBox'));

  const config={
    base_url:$('fsBaseUrl').value,
    origin:$('fsOrigin').value,
    user_id:$('fsUserId').value,
    sheet_name:$('fsSheet').value,
    header_row:parseInt($('fsHdr').value)||1,
    tables:enabled.map(t=>({
      name:t.name,token:t.token,enabled:true,
      active_sheet_ids:t.active_sheet_ids,
      local_key_names:t.local_key_names.filter(k=>k),
      feishu_key_names:t.feishu_key_names.filter(k=>k),
      fetch_col_names:t.fetch_col_names,
      cache_key:t.cache_key||'',
    })),
  };
  const fd=new FormData();fd.append('file',f);fd.append('config',JSON.stringify(config));
  try{
    const r=await fetch('/api/feishu/match',{method:'POST',body:fd});
    const d=await r.json();
    if(d.logs&&d.logs.length){$('fsLog').textContent=d.logs.join('\n');show($('fsLogBox'));}
    if(d.success){
      $('fsStats').innerHTML=`共 <b>${d.total}</b> 行 | 命中 <b>${d.matched}</b> | 未匹配 <b>${d.unmatched}</b>`;
      $('fsDl').href=d.download;show($('fsResult'));$('fsRunStatus2').textContent='完成！';
    } else {
      $('fsError').textContent=d.error||'匹配失败';show($('fsError'));$('fsRunStatus2').textContent='';
    }
  }catch(e){$('fsError').textContent=e.message;show($('fsError'));}
  $('fsRun').disabled=false;$('fsBatchUpdate').disabled=false;
}

// ═══════════════════ 页面加载 ═══════════════════
showOverview();
</script>
