<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BOM Tools · Web 版 v2</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family: -apple-system,'Segoe UI','Microsoft YaHei',sans-serif; display:flex; height:100vh; background:#f0f2f5; }
/* === 左侧导航 === */
.sidebar { width:250px; background:linear-gradient(180deg,#1a2942,#1a3a5c); color:#ccc; display:flex; flex-direction:column; flex-shrink:0; }
.sidebar .logo { padding:18px 16px; font-size:15px; font-weight:700; color:#fff; border-bottom:1px solid rgba(255,255,255,.08); cursor:pointer; }
.sidebar .logo .sub { font-size:11px; font-weight:400; color:#8ab4f8; display:block; margin-top:2px; }
.sidebar nav { flex:1; padding:8px 0; overflow-y:auto; }
.sidebar nav a { display:flex; align-items:center; gap:10px; padding:11px 18px; color:#b0bec5; text-decoration:none; font-size:14px; transition:all .12s; border-left:3px solid transparent; white-space:nowrap; }
.sidebar nav a:hover { background:rgba(255,255,255,.06); color:#e0e0e0; }
.sidebar nav a.active { background:rgba(45,108,223,.25); color:#fff; border-left-color:#4a9eff; font-weight:600; }
.sidebar nav a .icon { font-size:18px; width:24px; text-align:center; }
/* === 主内容 === */
.main { flex:1; display:flex; flex-direction:column; overflow:hidden; }
.toolbar { background:#fff; padding:10px 20px; border-bottom:1px solid #e0e0e0; display:flex; align-items:center; gap:12px; }
.toolbar h2 { font-size:18px; color:#1a3a5c; }
.toolbar .badge { background:#e8f0fe; color:#1a5ad4; padding:3px 10px; border-radius:10px; font-size:11px; }
.refresh-notice { display:none; align-items:center; justify-content:space-between; gap:12px; background:#fff7e6; border-bottom:1px solid #ffd591; color:#7a4b00; padding:9px 20px; font-size:13px; }
.refresh-notice.show { display:flex; }
.refresh-notice b { color:#5c3900; }
.refresh-notice button { border:1px solid #d48806; background:#fff; color:#874d00; border-radius:6px; padding:4px 10px; font-size:12px; font-weight:600; cursor:pointer; }
.refresh-notice button:hover { background:#fff1d6; }
.content { flex:1; overflow-y:auto; padding:16px 20px; }
/* === 通用组件 === */
.section { background:#fff; border-radius:10px; padding:16px 20px; margin-bottom:12px; box-shadow:0 1px 4px rgba(0,0,0,.06); }
.section h3 { font-size:14px; color:#1a3a5c; margin-bottom:10px; padding-bottom:6px; border-bottom:2px solid #e8f0fe; }
.row { display:flex; gap:10px; align-items:center; margin-bottom:10px; flex-wrap:wrap; }
.row label { font-weight:600; font-size:13px; min-width:65px; color:#444; white-space:nowrap; }
.row .hint { font-size:11px; color:#999; margin-left:4px; }
input[type="text"],input[type="number"],select { padding:7px 10px; border:1px solid #c8ccd0; border-radius:6px; font-size:13px; outline:none; }
input[type="text"]:focus,input[type="number"]:focus,select:focus { border-color:#4a9eff; box-shadow:0 0 0 2px rgba(74,158,255,.12); }
input[type="file"] { font-size:13px; }
.btn { padding:8px 18px; border:none; border-radius:6px; font-size:13px; font-weight:600; cursor:pointer; transition:all .12s; }
.btn-primary { background:#2d6cdf; color:#fff; }
.btn-primary:hover { background:#1a5ad4; }
.btn-primary:disabled { background:#a0bce8; cursor:not-allowed; }
.btn-outline { background:#fff; color:#2d6cdf; border:1px solid #2d6cdf; }
.btn-outline:hover { background:#e8f0fe; }
.btn-sm { padding:4px 12px; font-size:12px; }
.btn-gray { background:#f0f2f5; color:#555; border:1px solid #d0d5dd; }
.btn-gray:hover { background:#e0e4e8; }
.btn-green { background:#2a8a2a; color:#fff; }
.btn-green:hover { background:#227322; }
/* === 结果区 === */
.result { display:none; background:#f0fdf0; border:1px solid #a3d9a3; border-radius:8px; padding:14px 18px; margin-top:12px; }
.result.show { display:block; }
.result .title { color:#2a8a2a; font-weight:700; font-size:14px; }
.result .download { display:inline-block; margin-top:8px; background:#2a8a2a; color:#fff; padding:8px 18px; border-radius:6px; text-decoration:none; font-weight:600; font-size:13px; }
.result .download:hover { background:#227322; }
.error { display:none; background:#fff0f0; color:#c00000; padding:12px 16px; border-radius:8px; margin-top:12px; border:1px solid #f0c0c0; }
.error.show { display:block; }
/* === 表格 === */
table { width:100%; border-collapse:collapse; font-size:12px; margin-top:8px; }
th { background:#f0f2f5; padding:8px 6px; text-align:left; font-weight:600; border-bottom:2px solid #d0d5dd; position:sticky; top:0; white-space:nowrap; }
td { padding:7px 6px; border-bottom:1px solid #e8eaed; white-space:nowrap; }
tr:hover td { background:#f7f9fc; }
.table-wrap { max-height:320px; overflow:auto; border:1px solid #e0e0e0; border-radius:6px; }
.table-wrap table { width:max-content; min-width:100%; table-layout:auto; }
.table-wrap th,.table-wrap td { max-width:none; white-space:nowrap; border-right:1px solid #e5e7eb; }
.table-wrap th:last-child,.table-wrap td:last-child { border-right:none; }
.excel-preview { max-height:238px; }
.preview-note { margin:6px 0 4px; font-size:12px; color:#667085; }
/* === Tab 切换 === */
.tabs { display:flex; gap:0; border-bottom:2px solid #d0d5dd; margin-bottom:16px; }
.tab-btn { padding:8px 20px; background:#f5f7fa; border:1px solid #d0d5dd; border-bottom:none; border-radius:6px 6px 0 0; cursor:pointer; font-size:14px; font-weight:500; color:#666; margin-bottom:-2px; position:relative; }
.tab-btn.active { background:#fff; color:#1a5ad4; border-color:#1a5ad4; }
.tab-btn:hover { background:#eef2f7; }
.tab-content { display:none; }
.tab-content.active { display:block; }
/* === 树形列表（飞书表格库） === */
.tree-list { border:1px solid #e0e0e0; border-radius:6px; max-height:420px; overflow-y:auto; background:#fff; }
.tree-item { display:flex; align-items:center; padding:7px 12px; cursor:pointer; font-size:13px; border-bottom:1px solid #f0f0f0; gap:8px; }
.tree-item:hover { background:#f7f9fc; }
.tree-item.selected { background:#e8f0fe; color:#1a5ad4; font-weight:600; }
.tree-item .indent { width:16px; flex-shrink:0; }
.tree-cat { font-weight:700; font-size:12px; color:#1a5fa8; padding:6px 12px; background:#f0f5fd; border-bottom:1px solid #d0ddf0; cursor:default; }
.tree-cat.alt { color:#7a3a9a; background:#f8f0ff; border-bottom-color:#e0d0f0; }
.badge-sm { display:inline-block; padding:1px 8px; border-radius:8px; font-size:10px; font-weight:600; }
.badge-green { background:#e8f5e9; color:#2a8a2a; }
.badge-orange { background:#fff3e0; color:#e07000; }
.badge-gray { background:#f0f0f0; color:#888; }
.badge-blue { background:#e8f0fe; color:#2d6cdf; }
.badge-status-pending { background:#fff7e6; color:#b45f00; border:1px solid #ffd591; }
.badge-status-progress { background:#e6f4ff; color:#0958d9; border:1px solid #91caff; }
.badge-status-fixed { background:#e8f5e9; color:#237804; border:1px solid #b7eb8f; }
.badge-status-closed { background:#f0f0f0; color:#595959; border:1px solid #d9d9d9; }
.badge-status-paused { background:#f9f0ff; color:#722ed1; border:1px solid #d3adf7; }
.badge-status-invalid { background:#fff1f0; color:#cf1322; border:1px solid #ffa39e; }
/* === checkbox list === */
.chk-list { display:flex; flex-wrap:wrap; gap:3px; max-height:160px; overflow-y:auto; padding:6px; border:1px solid #e0e0e0; border-radius:6px; }
.chk-list label { display:inline-flex; align-items:center; gap:3px; padding:2px 8px; font-size:12px; cursor:pointer; border-radius:4px; white-space:nowrap; }
.chk-list label:hover { background:#f0f2f5; }
/* === 详情面板 === */
.detail-panel { background:#fafbfc; border:1px solid #e0e0e0; border-radius:6px; padding:14px; font-size:13px; }
.detail-panel h4 { font-size:14px; margin-bottom:8px; }
/* === 概览卡片 === */
.overview-grid { display:grid; grid-template-columns:1fr; gap:12px; animation:fadeIn .25s ease; }
@keyframes fadeIn { from{opacity:0;transform:translateY(8px)} to{opacity:1;transform:translateY(0)} }
.overview-card { display:flex; align-items:flex-start; gap:18px; background:#fff; border-radius:12px; padding:20px 22px; box-shadow:0 1px 4px rgba(0,0,0,.06); cursor:pointer; transition:all .15s; border:1px solid transparent; }
.overview-card:hover { box-shadow:0 4px 16px rgba(0,0,0,.1); border-color:#4a9eff; transform:translateY(-1px); }
.overview-card .oc-icon { font-size:36px; width:44px; text-align:center; flex-shrink:0; margin-top:2px; }
.overview-card .oc-body { flex:1; min-width:0; }
.overview-card .oc-title { font-size:16px; font-weight:700; color:#1a3a5c; margin-bottom:6px; }
.overview-card .oc-badge { display:inline-block; font-size:11px; font-weight:600; background:#e8f0fe; color:#1a5ad4; padding:1px 8px; border-radius:8px; vertical-align:middle; margin-left:6px; }
.overview-card .oc-desc { font-size:13px; color:#666; line-height:1.6; }
/* === 加载遮罩 === */
.spinner { display:inline-block; animation:spin .8s linear infinite; }
.fs-match-wait { display:none; align-items:flex-start; gap:12px; margin:12px 0 0; padding:12px 14px; border:1px solid #b7d4ff; border-radius:8px; background:#f4f8ff; color:#25466f; }
.fs-match-wait.show { display:flex; }
.fs-match-wait .wait-spinner { width:22px; height:22px; border:3px solid #cfe0ff; border-top-color:#2d6cdf; border-radius:50%; flex:0 0 auto; animation:spin .8s linear infinite; margin-top:2px; }
.fs-match-wait .wait-title { font-size:13px; font-weight:700; color:#163a6b; margin-bottom:4px; }
.fs-match-wait .wait-text { font-size:12px; line-height:1.6; color:#4f6178; }
@keyframes spin { 100% { transform:rotate(360deg); } }
/* === PLM 流程卡片 === */
.workflow-shell,.plm-shell { display:flex; flex-direction:column; gap:0; }
.workflow-hero,.plm-hero {
  background:linear-gradient(135deg,#eef5ff 0%,#f8fbff 100%);
  border:1px solid #d9e6ff;
  border-radius:12px;
  padding:14px 16px;
  box-shadow:0 1px 3px rgba(0,0,0,.04);
}
.workflow-hero h4,.plm-hero h4 { font-size:15px; color:#163a6b; margin-bottom:4px; }
.workflow-hero p,.plm-hero p { font-size:12px; color:#5f6d82; line-height:1.6; }
.plm-step { border:1px solid #e2e8f3; box-shadow:0 1px 3px rgba(18,38,63,.05); }
.plm-step h3 { display:flex; align-items:center; gap:8px; }
.plm-step-head { display:flex; align-items:flex-start; justify-content:space-between; gap:12px; margin-bottom:10px; }
.workflow-step-desc,.plm-step-desc { font-size:12px; color:#697586; line-height:1.5; margin:-4px 0 10px; }
.plm-info {
  background:#f7f9fc;
  border:1px dashed #d7deea;
  border-radius:8px;
  padding:8px 10px;
  font-size:12px;
  color:#5d6676;
}
.plm-table-card { background:#fff; border:1px solid #e3e8f2; border-radius:8px; overflow:hidden; }
.plm-actions { display:flex; align-items:center; flex-wrap:wrap; gap:8px; }
.plm-actions .hint { margin-left:2px; }
.plm-result-list { font-size:12px; line-height:1.8; color:#475063; }
.plm-result-list span { display:block; }
.workflow-shell > .section,.plm-shell > .section { border:1px solid #e2e8f3; box-shadow:0 1px 3px rgba(18,38,63,.05); margin-bottom:12px; }
.workflow-shell > .section h3,.plm-shell > .section h3 { display:flex; align-items:center; gap:8px; }
.workflow-shell .workflow-hero,.plm-shell .plm-hero { margin-bottom:12px; }
#plm-tab-bom-cfg #plmDetectLog {
  border:1px dashed #d7deea;
  border-radius:8px;
  color:#5d6676;
}
#plm-tab-bom-cfg #plmColMap,
#plm-tab-bom-cfg #plmQtyCfgTable { border-radius:8px; }
#plm-tab-bom-cfg #plmQtyCfgBody input { border-color:#d7deea; }
#plm-tab-bom-cfg #plmQtyCfgBody tr:hover td { background:#f6f9ff; }
.hash-drop-zone { display:grid; place-items:center; min-height:220px; padding:24px; border:2px dashed #d7deea; border-radius:8px; background:#fbfcfe; cursor:pointer; transition:border-color .16s ease,background .16s ease,box-shadow .16s ease; }
.hash-drop-zone:hover,.hash-drop-zone.dragging { border-color:#2d6cdf; background:#f4f8ff; box-shadow:0 1px 4px rgba(45,108,223,.08); }
.hash-drop-content { text-align:center; display:grid; gap:10px; justify-items:center; color:#475063; }
.hash-file-input { position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0,0,0,0); }
.hash-icon { width:52px; height:52px; display:grid; place-items:center; border-radius:8px; background:#2d6cdf; color:#fff; font-size:25px; font-weight:800; }
.hash-drop-title { font-size:16px; font-weight:700; color:#1a3a5c; }
.hash-status { margin-top:10px; min-height:22px; font-size:12px; color:#697586; }
.hash-status.error { color:#c00000; }
.hash-progress-panel { display:none; margin-top:12px; border:1px solid #b7d4ff; border-radius:10px; background:#f4f8ff; padding:14px 16px; box-shadow:0 2px 10px rgba(45,108,223,.10); }
.hash-progress-panel.show { display:block; }
.hash-progress-head { display:flex; align-items:flex-start; justify-content:space-between; gap:14px; margin-bottom:10px; }
.hash-progress-stage { font-size:17px; font-weight:800; color:#163a6b; line-height:1.35; }
.hash-progress-file { margin-top:3px; font-size:12px; color:#52657d; overflow-wrap:anywhere; }
.hash-progress-percent { min-width:62px; text-align:right; font-size:24px; font-weight:800; color:#1a5ad4; line-height:1; }
.hash-progress-track { height:12px; border-radius:999px; overflow:hidden; background:#dbe8ff; border:1px solid #c6d8f5; }
.hash-progress-bar { width:0%; height:100%; border-radius:999px; background:linear-gradient(90deg,#2d6cdf,#2a8a2a); transition:width .16s ease; }
.hash-progress-note { margin-top:8px; font-size:12px; color:#5f6d82; }
.hash-progress-panel.error { border-color:#f0c0c0; background:#fff5f5; }
.hash-progress-panel.error .hash-progress-stage,.hash-progress-panel.error .hash-progress-percent { color:#c00000; }
.hash-results { display:grid; gap:12px; }
.hash-card { background:#fff; border:1px solid #e2e8f3; border-radius:8px; padding:14px; display:grid; gap:10px; }
.hash-meta { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:10px; }
.hash-meta-item,.hash-row { min-width:0; }
.hash-label { display:block; margin-bottom:4px; font-size:11px; color:#697586; font-weight:700; }
.hash-value { overflow-wrap:anywhere; font-weight:700; color:#2f3a4a; }
.hash-row { display:grid; grid-template-columns:92px minmax(0,1fr) auto; align-items:center; gap:10px; }
.hash-row code { display:block; padding:9px 11px; border-radius:6px; background:#f1f5f9; color:#243447; font-family:Consolas,'Liberation Mono',Menlo,monospace; font-size:12px; line-height:1.45; overflow-wrap:anywhere; white-space:normal; }
.hash-row-md5 { grid-template-columns:92px minmax(0,1fr) auto; padding:10px; border:1px solid #cfe0ff; border-radius:8px; background:#f7fbff; }
.hash-row-md5 strong { color:#1a5ad4; font-size:15px; }
.hash-row-md5 code { background:#fff; border:1px solid #d9e6ff; color:#102a43; font-size:15px; font-weight:700; }
@media (max-width:720px){ .hash-meta,.hash-row { grid-template-columns:1fr; } .hash-row .btn { justify-self:start; } }
.manual-shell { max-width:1180px; margin:0 auto; }
.manual-hero { position:relative; overflow:hidden; border:1px solid #dbe5f2; border-radius:10px; padding:22px 24px; background:linear-gradient(135deg,#f8fbff 0%,#eef6ff 58%,#f7fafc 100%); box-shadow:0 1px 4px rgba(18,38,63,.06); }
.manual-hero h4 { font-size:20px; color:#12345a; margin-bottom:6px; letter-spacing:0; }
.manual-hero p { max-width:780px; font-size:13px; line-height:1.7; color:#52657d; }
.manual-hero-meta { display:flex; flex-wrap:wrap; gap:8px; margin-top:14px; }
.manual-chip { display:inline-flex; align-items:center; height:24px; padding:0 10px; border:1px solid #c9d9ee; border-radius:999px; background:#fff; color:#31577f; font-size:12px; font-weight:600; }
.manual-layout { display:grid; grid-template-columns:260px minmax(0,1fr); gap:14px; align-items:start; margin-top:14px; }
.manual-toc { position:sticky; top:12px; background:#fff; border:1px solid #e2e8f3; border-radius:10px; padding:12px; box-shadow:0 1px 4px rgba(18,38,63,.05); }
.manual-toc-title { font-size:12px; font-weight:700; color:#64748b; margin:0 0 8px; }
.manual-toc a { display:flex; align-items:center; gap:8px; padding:8px 10px; border-radius:7px; color:#334155; text-decoration:none; font-size:13px; line-height:1.35; }
.manual-toc a:hover { background:#f1f6ff; color:#1a5ad4; }
.manual-content { display:flex; flex-direction:column; gap:12px; min-width:0; }
.manual-note { padding:11px 13px; border:1px solid #f3d18a; background:#fffaf0; border-radius:9px; color:#715114; font-size:13px; line-height:1.7; }
.manual-tool { background:#fff; border:1px solid #e2e8f3; border-radius:10px; padding:18px; box-shadow:0 1px 4px rgba(18,38,63,.05); scroll-margin-top:14px; }
.manual-tool-head { display:flex; justify-content:space-between; gap:12px; align-items:flex-start; margin-bottom:14px; padding-bottom:10px; border-bottom:1px solid #e8eef7; }
.manual-tool h3 { font-size:17px; color:#163a6b; margin:0 0 5px; }
.manual-tool-desc { font-size:12px; color:#64748b; line-height:1.6; }
.manual-label { flex:0 0 auto; padding:4px 9px; border-radius:999px; background:#edf5ff; color:#1a5ad4; border:1px solid #cfe0ff; font-size:12px; font-weight:700; }
.manual-grid { display:grid; grid-template-columns:minmax(0,1.1fr) minmax(280px,.9fr); gap:14px; }
.manual-panel { border:1px solid #edf1f7; background:#fbfcfe; border-radius:9px; padding:13px 14px; }
.manual-panel h4 { font-size:13px; color:#26364a; margin:0 0 9px; display:flex; align-items:center; gap:7px; }
.manual-panel ul { margin:0; padding:0; list-style:none; color:#475063; font-size:13px; line-height:1.75; }
.manual-panel li { position:relative; padding-left:16px; margin-bottom:5px; }
.manual-panel li:before { content:""; position:absolute; left:0; top:.78em; width:6px; height:6px; border-radius:50%; background:#7aa7e8; }
.manual-steps { counter-reset:manual-step; display:flex; flex-direction:column; gap:8px; }
.manual-step { counter-increment:manual-step; display:grid; grid-template-columns:24px 1fr; gap:8px; align-items:flex-start; color:#475063; font-size:13px; line-height:1.6; }
.manual-step:before { content:counter(manual-step); width:22px; height:22px; border-radius:50%; display:inline-flex; align-items:center; justify-content:center; background:#163a6b; color:#fff; font-size:12px; font-weight:700; }
@media (max-width:900px){ .manual-layout { grid-template-columns:1fr; } .manual-toc { position:static; } .manual-grid { grid-template-columns:1fr; } }


</style>
</head>
<body>

<!-- ===== 左侧导航 ===== -->
<aside class="sidebar">
  <div class="logo" onclick="showOverview()">🛠 BOM Tools<span class="sub">硬件设计辅助平台 v2</span></div>
  <nav>
    <a href="#" data-tool="bom"><span class="icon">📋</span>BOM 格式转换</a>
    <a href="#" data-tool="feishu"><span class="icon">🔍</span>飞书优选库+关系库匹配</a>
    <a href="#" data-tool="manufacturer-alias"><span class="icon">&#127991;</span>厂商命名映射表</a>
    <a href="#" data-tool="pref-rate"><span class="icon">📊</span>查询BOM优选率</a>
    <a href="#" data-tool="plm"><span class="icon">📤</span>转换为上传PLM系统格式</a>
    <a href="#" data-tool="plm-auto"><span class="icon">&#127760;</span>PLM网页自动化</a>
    <a href="#" data-tool="bom-compare"><span class="icon">🧾</span>BOM比对工具合集</a>
    <a href="#" data-tool="toolbox"><span class="icon">🧰</span>小工具合集</a>
    <a href="#" data-tool="bug-report"><span class="icon">🐞</span>Bug提交栏目</a>
    <a href="#" data-tool="feature-request"><span class="icon">📝</span>需求开发工单</a>
    <a href="#" data-tool="manual"><span class="icon">📖</span>工具说明书</a>
  </nav>
</aside>

<!-- ===== 主内容区 ===== -->
<div class="main">
  <div class="toolbar">
    <h2 id="toolTitle">BOM Tools</h2>
    <span class="badge" id="toolBadge">硬件设计辅助平台</span>
  </div>
  <div class="refresh-notice" id="refreshNotice">
    <span><b>系统刚更新：</b>如果页面表现和最新功能不一致，请按 <b>Ctrl + F5</b> 强制刷新后再使用。</span>
    <button type="button" id="refreshNoticeAck">知道了</button>
  </div>
  <div class="content" id="contentArea"></div>

<script type="text/html" id="tpl-bom">
<div class="workflow-shell">
<div class="workflow-hero">
  <h4>BOM 格式转换</h4>
  <p>按“选文件 - 列映射 - 输出设置”的顺序处理。系统会自动识别常用列，也可以手动填写列字母覆盖识别结果。</p>
</div>
<div class="section"><h3>第一步：选择文件</h3>
  <div class="workflow-step-desc">上传待转换的 BOM，并确认 Sheet 和表头行，下面会显示预览方便核对。</div>
  <div class="row"><label>文件路径：</label><input type="file" id="bomFile" accept=".xlsx,.xlsm,.xls" style="width:320px"></div>
  <div class="row"><label>Sheet：</label><select id="bomSheet" style="width:180px"><option>先选择文件</option></select><label>表头行：</label><input type="number" id="bomHdr" value="1" min="1" style="width:60px"><button class="btn btn-sm btn-gray" id="bomRefresh">刷新预览</button></div>
  <div class="preview-note">仅预览前 50 行，正式处理会读取完整表格。</div>
  <div id="bomPreview" class="table-wrap excel-preview" style="margin-top:8px"></div>
</div>
<div class="section"><h3>第二步：列映射（自动识别，可手动调整）</h3>
  <div class="workflow-step-desc">选择原始 BOM 的格式，并确认物料名称、用量、品牌/厂家、型号等关键列。</div>
  <div class="row">
    <label>格式：</label>
    <select id="bomFmt">
      <option value="A">格式A — 品牌型号合并列（|| 或空格分隔，如 MURATA:GRM188||SAMSUNG:CL10）</option>
      <option value="B">格式B — 厂家/型号分开列，分号分隔（如 YAGEO;KOA / RC0805;RK73）</option>
      <option value="C">格式C — 制造商含编号，冒号分隔（如 1630-大毅科技[全称]:0362-RALEC[全称]）</option>
    </select>
  </div>
  <div class="row">
    <label>物料名称列：</label><input type="text" id="bomColName" style="width:80px" placeholder="如 C">
    <label>用量列：</label><input type="text" id="bomColQty" style="width:80px" placeholder="如 D">
    <label>品牌/厂家列：</label><input type="text" id="bomColBrand" style="width:80px" placeholder="如 E">
    <label>型号列：</label><input type="text" id="bomColModel" style="width:80px" placeholder="如 F">
    <span class="hint">（填写列字母，格式A无需填型号列）</span>
  </div>
  <div id="bomDetected" style="font-size:12px;color:#555;background:#f7f9fc;padding:8px;border-radius:6px;margin-top:4px"></div>
</div>
<div class="section"><h3>第三步：输出设置</h3>
  <div class="workflow-step-desc">输出为供应商展开表，保留原列并将供应商拆分为独立行。</div>
  <div class="row">
    <label>输出模式：</label>
    <select id="bomOutputMode">
      <option value="expand">原格式展开（保留原列，供应商拆多行，新增厂商/型号/是否独供列）</option>
    </select>
  </div>
  <button class="btn btn-primary" id="bomRun">⚡ 开始转换</button> <span id="bomStatus" style="font-size:13px;color:#888"></span>
</div>
<div class="result" id="bomResult"><span class="title">✅ 转换完成</span><br><span id="bomStats" style="display:inline-block;margin-top:6px"></span><br><a class="download" id="bomDl" href="#">📥 下载结果文件</a></div>
<div class="error" id="bomError"></div>
</div>
</script>

  <button class="plm-auto-tab-btn active" type="button" style="padding:6px 18px;border:none;background:none;font-size:13px;font-weight:600;color:#1a5ad4;border-bottom:2px solid #1a5ad4;margin-bottom:-2px;cursor:pointer">规格型号反查物料</button>
</div>
<div class="workflow-shell">
<div class="workflow-hero">
  <h4>规格型号反查物料</h4>
  <p>上传规格型号反查文件，自动登录 EIP/PLM，执行查询并下载“结果导出”文件。</p>
</div>
<div class="section"><h3>第一步：填写登录信息</h3>
  <div class="row"><label>账号：</label><input type="text" id="paUser" value="" autocomplete="username" style="width:220px"></div>
  <div class="row"><label>密码：</label><input type="password" id="paPass" autocomplete="current-password" style="width:220px"></div>
</div>
<div class="section"><h3>第二步：选择上传文件</h3>
  <div class="row"><label>文件路径：</label><input type="file" id="paFile" accept=".xlsx,.xlsm,.xls" style="width:360px"></div>
</div>
<div class="section"><h3>第三步：运行自动化</h3>
  <button class="btn btn-primary" id="paRun">开始自动查询导出</button>
  <span id="paStatus" style="font-size:13px;margin-left:10px;color:#888"></span>
</div>
<div class="result" id="paResult">
  <span class="title">导出完成</span>
  <div id="paStats" style="margin-top:6px;font-size:13px"></div>
  <a class="download" id="paDl" href="#">下载 PLM 导出结果</a>
</div>
<div class="error" id="paError"></div>
<div id="paLogBox" style="display:none;margin-top:10px"><h4 style="margin:0 0 6px;font-size:13px">执行日志</h4><pre id="paLog" style="font-size:12px;background:#1a1a2e;color:#e0e0e0;padding:10px;border-radius:6px;max-height:220px;overflow:auto;white-space:pre-wrap;font-family:Consolas,'Courier New',monospace"></pre></div>
</div>
</script>
<script type="text/html" id="tpl-toolbox">
<div class="workflow-shell">
  <div style="display:flex;gap:8px;margin-bottom:18px;border-bottom:2px solid #e0e4ef;padding-bottom:0">
    <button class="toolbox-tab-btn active" type="button" style="padding:6px 18px;border:none;background:none;font-size:13px;font-weight:600;color:#1a5ad4;border-bottom:2px solid #1a5ad4;margin-bottom:-2px;cursor:pointer">计算哈希值</button>
  </div>
  <div class="workflow-hero">
    <h4>计算哈希值</h4>
    <p>在浏览器本地计算文件 MD5，文件内容不会上传到服务器。</p>
  </div>

  <div class="section">
    <h3>① 选择文件</h3>
    <div class="workflow-step-desc">支持拖入一个或多个文件，也可以点击选择文件。大文件计算耗时取决于浏览器读取速度。</div>
    <label class="hash-drop-zone" id="hashDropZone">
      <input class="hash-file-input" id="hashFileInput" type="file" multiple>
      <span class="hash-drop-content">
        <span class="hash-icon">#</span>
        <span class="hash-drop-title">拖入文件，或点击选择</span>
        <span class="btn btn-primary">选择文件</span>
      </span>
    </label>
    <div class="hash-status" id="hashStatus">等待选择文件</div>
    <div class="hash-progress-panel" id="hashProgressPanel" aria-live="polite">
      <div class="hash-progress-head">
        <div>
          <div class="hash-progress-stage" id="hashProgressStage">等待开始</div>
          <div class="hash-progress-file" id="hashProgressFile"></div>
        </div>
        <div class="hash-progress-percent" id="hashProgressPercent">0%</div>
      </div>
      <div class="hash-progress-track"><div class="hash-progress-bar" id="hashProgressBar"></div></div>
      <div class="hash-progress-note" id="hashProgressNote">文件不会上传服务器，所有计算都在本地浏览器完成。</div>
    </div>
  </div>

  <div class="section" id="hashResultsSection" style="display:none">
    <h3>② 计算结果</h3>
    <div class="hash-results" id="hashResults" aria-live="polite"></div>
  </div>
</div>
</script>

<script type="text/html" id="tpl-bug-report">
<div class="workflow-shell">
<div class="workflow-hero">
  <h4>Bug 提交栏目</h4>
  <p>提交工具使用中遇到的问题、附件和复现信息。所有提交记录会保存在服务端，团队成员打开页面即可查看。</p>
</div>
<div style="display:grid;grid-template-columns:minmax(360px,430px) 1fr;gap:14px;align-items:start">
  <div class="section"><h3>提交问题</h3>
    <div class="workflow-step-desc">请尽量写清楚问题发生在哪个工具、怎么复现、期望结果是什么。截图、Excel、日志或压缩包可多选上传。</div>
    <div class="row" style="display:grid;grid-template-columns:minmax(180px,220px) minmax(160px,200px);gap:12px;align-items:end">
      <label style="display:flex;flex-direction:column;gap:6px">姓名：<input type="text" id="bugReporter" style="width:100%"></label>
      <label style="display:flex;flex-direction:column;gap:6px">工号：<input type="text" id="bugEmployeeId" style="width:100%"></label>
    </div>
    <div class="row">
      <label>影响模块：</label>
      <select id="bugModule" style="width:220px">
        <option>BOM 格式转换</option>
        <option>飞书优选库+关系库匹配</option>
        <option>查询BOM优选率</option>
        <option>转换为上传PLM系统格式</option>
        <option>BOM比对工具合集</option>
        <option>其他</option>
      </select>
      <label>严重程度：</label>
      <select id="bugSeverity" style="width:100px">
        <option>一般</option>
        <option>阻塞</option>
        <option>严重</option>
        <option>建议</option>
      </select>
    </div>
    <div class="row"><label>问题标题：</label><input type="text" id="bugTitle" style="width:100%" placeholder="一句话描述问题"></div>
    <div class="row" style="align-items:flex-start"><label>问题描述：</label><textarea id="bugDesc" style="width:100%;height:100px;padding:8px;border:1px solid #c8ccd0;border-radius:6px;font-family:inherit" placeholder="实际发生了什么？报错信息是什么？"></textarea></div>
    <div class="row" style="align-items:flex-start"><label>复现步骤：</label><textarea id="bugSteps" style="width:100%;height:84px;padding:8px;border:1px solid #c8ccd0;border-radius:6px;font-family:inherit" placeholder="例如：1. 上传文件... 2. 点击... 3. 出现..."></textarea></div>
    <div class="row" style="align-items:flex-start"><label>期望结果：</label><textarea id="bugExpected" style="width:100%;height:64px;padding:8px;border:1px solid #c8ccd0;border-radius:6px;font-family:inherit" placeholder="你期望系统怎么处理？"></textarea></div>
    <div class="row"><label>附件：</label><input type="file" id="bugImages" accept="image/*,.xlsx,.xlsm,.xls,.csv,.txt,.log,.zip,.rar,.7z" multiple style="width:300px"><span class="hint">支持截图、Excel、CSV、日志文本和压缩包</span></div>
    <button class="btn btn-primary" id="bugSubmit" type="button">提交问题</button>
    <span id="bugStatus" style="font-size:13px;color:#888;margin-left:8px"></span>
    <div class="error" id="bugError"></div>
  </div>
  <div class="section"><h3>问题记录</h3>
    <div class="workflow-step-desc">按提交时间倒序展示。点击问题卡片可查看详情并修改处理状态，附件可直接打开查看。</div>
    <div class="row" style="flex-wrap:wrap">
      <label>状态：</label>
      <select id="bugFilterStatus" style="width:120px"><option value="">全部状态</option><option>待处理</option><option>处理中</option><option>已修复</option><option>已关闭</option><option>暂缓</option><option>无法复现</option></select>
      <label>模块：</label>
      <select id="bugFilterModule" style="width:190px"><option value="">全部模块</option><option>BOM 格式转换</option><option>飞书优选库+关系库匹配</option><option>查询BOM优选率</option><option>转换为上传PLM系统格式</option><option>BOM比对工具合集</option><option>小工具合集</option><option>平台通用</option><option>其他</option></select>
      <input type="search" id="bugFilterQuery" placeholder="搜索标题、描述、提交人" style="width:190px">
      <button class="btn btn-sm btn-gray" id="bugRefresh" type="button">刷新记录</button>
      <span id="bugListStatus" style="font-size:12px;color:#888"></span>
    </div>
    <div id="bugList" style="display:flex;flex-direction:column;gap:10px"></div>
    <div id="bugDetailModal" style="display:none;position:fixed;inset:0;background:rgba(15,23,42,.38);z-index:50;align-items:center;justify-content:center;padding:18px">
      <div style="width:min(760px,92vw);max-height:86vh;overflow:auto;background:#fff;border-radius:12px;box-shadow:0 16px 50px rgba(15,23,42,.22);padding:18px">
        <div style="display:flex;justify-content:space-between;gap:12px;align-items:flex-start;border-bottom:1px solid #e8edf5;padding-bottom:10px">
          <div><h3 id="bugDetailTitle" style="margin:0 0 6px"></h3><div id="bugDetailMeta" style="font-size:12px;color:#667085"></div></div>
          <button class="btn btn-sm btn-gray" id="bugDetailClose" type="button">关闭</button>
        </div>
        <div style="margin-top:12px" id="bugDetailBody"></div>
        <div class="row" style="margin-top:14px;border-top:1px solid #e8edf5;padding-top:12px">
          <label>处理状态：</label>
          <select id="bugDetailStatus" style="width:120px"><option>待处理</option><option>处理中</option><option>已修复</option><option>已关闭</option><option>暂缓</option><option>无法复现</option></select>
          <button class="btn btn-primary" id="bugDetailSave" type="button">保存状态</button>
          <span id="bugDetailMsg" style="font-size:13px;color:#888"></span>
        </div>
      </div>
    </div>
  </div>
</div>
</div>
</script>

<script type="text/html" id="tpl-feature-request">
<div class="workflow-shell">
<div class="workflow-hero">
  <h4>需求开发工单</h4>
  <p>提交新功能、流程优化或开发需求。记录会保存在服务端，便于后续评估和跟进。</p>
</div>
<div style="display:grid;grid-template-columns:minmax(380px,460px) 1fr;gap:14px;align-items:start">
  <div class="section"><h3>提交需求</h3>
    <div class="workflow-step-desc">请写清楚使用场景、希望怎么改、验收标准。原始 BOM、示例文件或说明文档可作为附件上传。</div>
    <div class="row" style="display:grid;grid-template-columns:minmax(180px,220px) minmax(160px,200px);gap:12px;align-items:end">
      <label style="display:flex;flex-direction:column;gap:6px">姓名：<input type="text" id="featureRequester" style="width:100%"></label>
      <label style="display:flex;flex-direction:column;gap:6px">工号：<input type="text" id="featureEmployeeId" style="width:100%"></label>
    </div>
    <div class="row"><label>需求类型：</label><select id="featureType" style="width:120px"><option>新功能</option><option>功能优化</option><option>流程改进</option><option>自动化</option><option>其他</option></select><label>优先级：</label><select id="featurePriority" style="width:90px"><option>一般</option><option>较高</option><option>紧急</option><option>低</option></select></div>
    <div class="row"><label>影响模块：</label><select id="featureModule" style="width:240px"><option>BOM 格式转换</option><option>飞书优选库+关系库匹配</option><option>查询BOM优选率</option><option>转换为上传PLM系统格式</option><option>BOM比对工具合集</option><option>平台通用</option><option>其他</option></select></div>
    <div class="row"><label>需求标题：</label><input type="text" id="featureTitle" style="width:100%" placeholder="一句话概括要做什么"></div>
    <div class="row" style="align-items:flex-start"><label>需求背景：</label><textarea id="featureBackground" style="width:100%;height:78px;padding:8px;border:1px solid #c8ccd0;border-radius:6px;font-family:inherit" placeholder="现在的痛点或使用场景"></textarea></div>
    <div class="row" style="align-items:flex-start"><label>需求说明：</label><textarea id="featureRequirement" style="width:100%;height:112px;padding:8px;border:1px solid #c8ccd0;border-radius:6px;font-family:inherit" placeholder="希望系统怎么处理，输入和输出是什么"></textarea></div>
    <div class="row" style="align-items:flex-start"><label>预期价值：</label><textarea id="featureValue" style="width:100%;height:64px;padding:8px;border:1px solid #c8ccd0;border-radius:6px;font-family:inherit" placeholder="能节省哪些时间或降低哪些风险"></textarea></div>
    <div class="row" style="align-items:flex-start"><label>验收标准：</label><textarea id="featureAcceptance" style="width:100%;height:64px;padding:8px;border:1px solid #c8ccd0;border-radius:6px;font-family:inherit" placeholder="做到什么程度算完成"></textarea></div>
    <div class="row"><label>附件：</label><input type="file" id="featureFiles" accept="image/*,.xlsx,.xlsm,.xls,.csv,.txt,.log,.zip,.rar,.7z,.doc,.docx,.ppt,.pptx,.pdf" multiple style="width:300px"><span class="hint">支持截图、Excel、CSV、Office/PDF、日志文本和压缩包</span></div>
    <button class="btn btn-primary" id="featureSubmit" type="button">提交工单</button><span id="featureStatus" style="font-size:13px;color:#888;margin-left:8px"></span><div class="error" id="featureError"></div>
  </div>
  <div class="section"><h3>需求记录</h3><div class="workflow-step-desc">按提交时间倒序展示。点击需求卡片可查看详情并修改状态，附件可直接打开查看。</div><div class="row" style="flex-wrap:wrap"><label>状态：</label><select id="featureFilterStatus" style="width:120px"><option value="">全部状态</option><option>待评估</option><option>已纳入</option><option>开发中</option><option>已完成</option><option>暂缓</option><option>已关闭</option></select><label>模块：</label><select id="featureFilterModule" style="width:190px"><option value="">全部模块</option><option>BOM 格式转换</option><option>飞书优选库+关系库匹配</option><option>查询BOM优选率</option><option>转换为上传PLM系统格式</option><option>BOM比对工具合集</option><option>平台通用</option><option>其他</option></select><label>排序：</label><select id="featureSort" style="width:110px"><option value="newest">最新提交</option><option value="likes">点赞最多</option></select><input type="search" id="featureFilterQuery" placeholder="搜索标题、说明、提交人" style="width:190px"><button class="btn btn-sm btn-gray" id="featureRefresh" type="button">刷新记录</button><span id="featureListStatus" style="font-size:12px;color:#888"></span></div><div id="featureList" style="display:flex;flex-direction:column;gap:10px"></div>
    <div id="featureDetailModal" style="display:none;position:fixed;inset:0;background:rgba(15,23,42,.38);z-index:50;align-items:center;justify-content:center;padding:18px">
      <div style="width:min(760px,92vw);max-height:86vh;overflow:auto;background:#fff;border-radius:12px;box-shadow:0 16px 50px rgba(15,23,42,.22);padding:18px">
        <div style="display:flex;justify-content:space-between;gap:12px;align-items:flex-start;border-bottom:1px solid #e8edf5;padding-bottom:10px">
          <div><h3 id="featureDetailTitle" style="margin:0 0 6px"></h3><div id="featureDetailMeta" style="font-size:12px;color:#667085"></div></div>
          <button class="btn btn-sm btn-gray" id="featureDetailClose" type="button">关闭</button>
        </div>
        <div style="margin-top:12px" id="featureDetailBody"></div>
        <div class="row" style="margin-top:14px;border-top:1px solid #e8edf5;padding-top:12px">
          <label>需求状态：</label>
          <select id="featureDetailStatus" style="width:120px"><option>待评估</option><option>已纳入</option><option>开发中</option><option>已完成</option><option>暂缓</option><option>已关闭</option></select>
          <button class="btn btn-primary" id="featureDetailSave" type="button">保存状态</button>
          <span id="featureDetailMsg" style="font-size:13px;color:#888"></span>
        </div>
      </div>
    </div>
  </div>
</div>
</div>
</script>

<!-- ── BOM 比对工具 ── -->
<script type="text/html" id="tpl-bom-compare">
<!-- 子功能 Tab -->
<div style="display:flex;gap:8px;margin-bottom:18px;border-bottom:2px solid #e0e4ef;padding-bottom:0">
  <button class="bomcmp-tab-btn active" data-bomcmp-tab="customer-hq" style="padding:6px 18px;border:none;background:none;font-size:13px;font-weight:600;color:#1a5ad4;border-bottom:2px solid #1a5ad4;margin-bottom:-2px;cursor:pointer">客户BOM对比HQ BOM</button>
  <button class="bomcmp-tab-btn" data-bomcmp-tab="hq-version" style="padding:6px 18px;border:none;background:none;font-size:13px;font-weight:600;color:#888;border-bottom:2px solid transparent;margin-bottom:-2px;cursor:pointer">单板HQ BOM版本对比</button>
  <button class="bomcmp-tab-btn" data-bomcmp-tab="machine-hq-version" style="padding:6px 18px;border:none;background:none;font-size:13px;font-weight:600;color:#888;border-bottom:2px solid transparent;margin-bottom:-2px;cursor:pointer">整机HQ BOM版本对比</button>
  <button class="bomcmp-tab-btn" data-bomcmp-tab="cadence-hq" style="padding:6px 18px;border:none;background:none;font-size:13px;font-weight:600;color:#888;border-bottom:2px solid transparent;margin-bottom:-2px;cursor:pointer">Cadence导出BOM对比HQ BOM</button>
</div>


<div id="bomcmp-tab-customer-hq" class="workflow-shell">
  <div class="workflow-hero">
    <h4>客户BOM对比HQ BOM</h4>
    <p>第一版先做标准化预览：映射客户列、选择匹配模式，确认系统如何理解客户 BOM 和 HQ BOM。</p>
  </div>
  <div class="section"><h3>第一步：上传文件</h3>
    <div class="workflow-step-desc">客户 BOM 格式不固定；HQ BOM 按固定格式自动识别。先加载列，再做字段映射。</div>
    <div class="row"><label>客户 BOM：</label><input type="file" id="custLeftFile" accept=".xlsx,.xlsm,.xls" style="width:320px"></div>
    <div class="row"><label>HQ BOM：</label><input type="file" id="custRightFile" accept=".xlsx,.xlsm,.xls" style="width:320px"></div>
    <div class="row">
      <label>客户 Sheet：</label><select id="custLeftSheet" style="width:180px"><option>先选择文件</option></select>
      <label>客户表头行：</label><input type="number" id="custLeftHdr" value="1" min="1" style="width:60px">
      <label>HQ Sheet：</label><select id="custRightSheet" style="width:180px"><option>先选择文件</option></select>
      <button class="btn btn-sm btn-gray" id="custRefresh" type="button">加载列</button>
    </div>
    <div id="custLoadStatus" style="font-size:12px;color:#888"></div>
  </div>
  <div class="section"><h3>第二步：标准字段映射</h3>
    <div class="workflow-step-desc">规格型号和制造商必选；位号、数量可选。这里仅处理客户 BOM 列到标准字段的映射。</div>
    <div class="row" style="display:grid;grid-template-columns:repeat(4,minmax(170px,1fr));gap:10px;align-items:end">
      <label style="display:flex;flex-direction:column;gap:6px;min-width:0">规格型号：<select id="custMapModel" style="width:100%"><option value="">先加载列</option></select></label>
      <label style="display:flex;flex-direction:column;gap:6px;min-width:0">制造商：<select id="custMapManufacturer" style="width:100%"><option value="">先加载列</option></select></label>
      <label style="display:flex;flex-direction:column;gap:6px;min-width:0">位号：<select id="custMapRefdes" style="width:100%"><option value="">不使用位号</option></select></label>
      <label style="display:flex;flex-direction:column;gap:6px;min-width:0">数量/用量：<select id="custMapQuantity" style="width:100%"><option value="">不映射</option></select></label>
    </div>
  </div>
  <div class="section"><h3>第三步：选择匹配模式</h3>
    <div class="workflow-step-desc">匹配模式决定客户 BOM 和 HQ BOM 哪些行会被认为是同一个物料。没有位号的客户 BOM 建议使用型号+制造商。</div>
    <div class="row">
      <label>匹配模式：</label><select id="custMatchMode" style="width:240px"><option value="identity">按型号+制造商匹配</option><option value="refdes">按位号匹配</option></select>
    </div>
  </div>
  <div class="section"><h3>第四步：预览标准化结果</h3>
    <button class="btn btn-primary" id="custPreview" type="button">预览标准化结果</button>
    <button class="btn btn-outline" id="custExport" type="button">下载详细比对报告</button>
    <span id="custStatus" style="font-size:13px;color:#888;margin-left:8px"></span>
    <div class="error" id="custError"></div>
    <div class="result" id="custExportResult"><span class="title">详细比对报告已生成</span><br><span id="custExportStats" style="display:inline-block;margin-top:6px"></span><br><a class="download" id="custExportDl" href="#">下载详细比对报告</a></div>

<script>
// ═══════════════════ 通用函数 ═══════════════════
function $(id){return document.getElementById(id);}
function show(el){if(el) el.style.display='block';}
function hide(el){if(el) el.style.display='none';}
function setStatus(id, msg, color){
  const el=$(id);
  if(!el) return;
  el.textContent=msg||'';
  if(color) el.style.color=color;
}
function showInlineError(errorId, msg, statusId){
  const el=$(errorId);
  if(el){
    el.textContent=msg||'操作失败';
    show(el);
  }
  if(statusId) setStatus(statusId,'');
}
function clearInlineError(errorId){
  const el=$(errorId);
  if(!el) return;
  el.textContent='';
  hide(el);
}

function excelLoadingHtml(msg){
  return `<div style="padding:14px 16px;color:#5f6d82;background:#f7f9fc;border:1px dashed #cbd5e1;border-radius:8px;font-size:13px"><span class="spinner">&#8635;</span> ${_escH(msg||'\u6b63\u5728\u8bfb\u53d6 Excel...')}</div>`;
}
function setLoadingStatus(id,msg){
  const el=$(id); if(!el) return;
  el.innerHTML=`<span class="spinner">&#8635;</span> ${_escH(msg||'\u52a0\u8f7d\u4e2d...')}`;
}

async function postFormJson(url, fd){
  const r=await fetch(url,{method:'POST',body:fd});
  let d;
  try{
    d=await r.json();
  }catch(e){
    throw new Error('服务器返回格式异常');
  }
  if(!r.ok && d && !d.error) d.error='请求失败：HTTP '+r.status;
  return d;
}

const HASH_MD5_S = [
  7,12,17,22,7,12,17,22,7,12,17,22,7,12,17,22,
  5,9,14,20,5,9,14,20,5,9,14,20,5,9,14,20,

function hashRotL(value, shift){ return (value << shift) | (value >>> (32 - shift)); }
function hashAdd32(){ return Array.from(arguments).reduce((sum,value)=>(sum + value) >>> 0, 0); }
function hashMd5(buffer){
  const bytes = new Uint8Array(buffer);
  const originalLength = bytes.length;
  const paddedLength = (((originalLength + 8) >>> 6) + 1) << 6;
  const padded = new Uint8Array(paddedLength);
  padded.set(bytes);
  padded[originalLength] = 0x80;
  const bitLength = originalLength * 8;
  for(let i=0;i<8;i++) padded[paddedLength - 8 + i] = Math.floor(bitLength / Math.pow(2, 8 * i)) & 0xff;
  let a0=0x67452301,b0=0xefcdab89,c0=0x98badcfe,d0=0x10325476;
  for(let offset=0;offset<paddedLength;offset+=64){
    const m = new Uint32Array(16);
    for(let i=0;i<16;i++){
      const j = offset + i * 4;
      m[i] = padded[j] | (padded[j+1] << 8) | (padded[j+2] << 16) | (padded[j+3] << 24);
    }
    let a=a0,b=b0,c=c0,d=d0;
    for(let i=0;i<64;i++){
      let f,g;
      if(i<16){ f=(b & c) | ((~b) & d); g=i; }
      else if(i<32){ f=(d & b) | ((~d) & c); g=(5*i+1)%16; }
      else if(i<48){ f=b ^ c ^ d; g=(3*i+5)%16; }
      else { f=c ^ (b | (~d)); g=(7*i)%16; }
      const temp=d;
      d=c; c=b;
      b=hashAdd32(b, hashRotL(hashAdd32(a, f, HASH_MD5_K[i], m[g]), HASH_MD5_S[i]));
      a=temp;
    }
    a0=hashAdd32(a0,a); b0=hashAdd32(b0,b); c0=hashAdd32(c0,c); d0=hashAdd32(d0,d);
  }
  return [a0,b0,c0,d0].flatMap(word=>[word&0xff,(word>>>8)&0xff,(word>>>16)&0xff,(word>>>24)&0xff])
    .map(byte=>byte.toString(16).padStart(2,'0')).join('');
}
function hashFormatSize(bytes){
  if(bytes === 0) return '0 B';
  const units = ['B','KB','MB','GB','TB'];
  const index = Math.min(Math.floor(Math.log(bytes) / Math.log(1024)), units.length - 1);
  return (bytes / Math.pow(1024, index)).toFixed(index === 0 ? 0 : 2) + ' ' + units[index];
}
function hashReadFileBuffer(file, onProgress){
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onprogress = function(event){
      if(event.lengthComputable && onProgress){
        onProgress('读取文件', Math.round(event.loaded / event.total * 100));
      }
    };
    reader.onload = function(){ resolve(reader.result); };
    reader.onerror = function(){ reject(reader.error || new Error('文件读取失败')); };
    reader.readAsArrayBuffer(file);
  });
}
function hashCreateMd5Worker(){
  const workerCode = `
const HASH_MD5_K=${JSON.stringify(HASH_MD5_K)};
const HASH_MD5_S=${JSON.stringify(HASH_MD5_S)};
function hashRotL(value, shift){ return (value << shift) | (value >>> (32 - shift)); }
function hashAdd32(){ return Array.from(arguments).reduce((sum,value)=>(sum + value) >>> 0, 0); }
function hashMd5(buffer){
  const bytes = new Uint8Array(buffer);
  const originalLength = bytes.length;
  const paddedLength = (((originalLength + 8) >>> 6) + 1) << 6;
  const padded = new Uint8Array(paddedLength);
  padded.set(bytes);
  padded[originalLength] = 0x80;
  const bitLength = originalLength * 8;
  for(let i=0;i<8;i++) padded[paddedLength - 8 + i] = Math.floor(bitLength / Math.pow(2, 8 * i)) & 0xff;
  let a0=0x67452301,b0=0xefcdab89,c0=0x98badcfe,d0=0x10325476;
  for(let offset=0;offset<paddedLength;offset+=64){
    const m = new Uint32Array(16);
    for(let i=0;i<16;i++){
      const j = offset + i * 4;
      m[i] = padded[j] | (padded[j+1] << 8) | (padded[j+2] << 16) | (padded[j+3] << 24);
    }
    let a=a0,b=b0,c=c0,d=d0;
    for(let i=0;i<64;i++){
      let f,g;
      if(i<16){ f=(b & c) | ((~b) & d); g=i; }
      else if(i<32){ f=(d & b) | ((~d) & c); g=(5*i+1)%16; }
      else if(i<48){ f=b ^ c ^ d; g=(3*i+5)%16; }
      else { f=c ^ (b | (~d)); g=(7*i)%16; }
      const temp=d;
      d=c; c=b;
      b=hashAdd32(b, hashRotL(hashAdd32(a, f, HASH_MD5_K[i], m[g]), HASH_MD5_S[i]));
      a=temp;
    }
    a0=hashAdd32(a0,a); b0=hashAdd32(b0,b); c0=hashAdd32(c0,c); d0=hashAdd32(d0,d);
    if(offset % 1048576 === 0) postMessage({type:'progress', pct:Math.min(99, Math.round(offset / paddedLength * 100))});
  }
  return [a0,b0,c0,d0].flatMap(word=>[word&0xff,(word>>>8)&0xff,(word>>>16)&0xff,(word>>>24)&0xff])
    .map(byte=>byte.toString(16).padStart(2,'0')).join('');
}
onmessage = function(event){
  try{
    postMessage({type:'progress', pct:0});
    const md5 = hashMd5(event.data);
    postMessage({type:'done', md5});
  }catch(err){
    postMessage({type:'error', error:err && err.message ? err.message : String(err)});
  }
};`;
  const url = URL.createObjectURL(new Blob([workerCode], {type:'application/javascript'}));
  const worker = new Worker(url);
  worker._hashWorkerUrl = url;
  return worker;
}
function hashMd5InWorker(buffer, onProgress){
  return new Promise((resolve, reject)=>{
    if(!window.Worker){
      resolve(hashMd5(buffer));
      return;
    }
    const worker = hashCreateMd5Worker();
    worker.onmessage = function(event){
      const data = event.data || {};
      if(data.type === 'progress' && onProgress) onProgress('计算 MD5', data.pct || 0);
      if(data.type === 'done'){
        if(onProgress) onProgress('计算 MD5', 100);
        URL.revokeObjectURL(worker._hashWorkerUrl);
        worker.terminate();
        resolve(data.md5);
      }
      if(data.type === 'error'){
        URL.revokeObjectURL(worker._hashWorkerUrl);
        worker.terminate();
        reject(new Error(data.error || 'MD5 计算失败'));
      }
    };
    worker.onerror = function(event){
      URL.revokeObjectURL(worker._hashWorkerUrl);
      worker.terminate();
      reject(new Error(event.message || 'MD5 计算失败'));
    };
    worker.postMessage(buffer, [buffer]);
  });
}

  card.className = 'hash-card';
  card.innerHTML =
    '<div class="hash-meta">' +
      '<div class="hash-meta-item"><span class="hash-label">文件名</span><span class="hash-value" data-role="name"></span></div>' +

async function hashCalculateFile(file){
  return hashCalculateFileWithProgress(file);
}
async function hashCalculateFileWithProgress(file, onProgress){
  const buffer = await hashReadFileBuffer(file, onProgress);
  const md5 = await hashMd5InWorker(buffer, onProgress);
  return {md5:md5};
}
async function hashCopyText(text){
  if(navigator.clipboard && navigator.clipboard.writeText){
    await navigator.clipboard.writeText(text);
    return;
  }
  const ta = document.createElement('textarea');
  ta.value = text;
  ta.style.position = 'fixed';
  ta.style.left = '-9999px';
  document.body.appendChild(ta);
  ta.select();
  document.execCommand('copy');
  ta.remove();
}
function hashUpdateProgress(stage, fileName, pct, note, isError){
  const panel = $('hashProgressPanel');
  const stageEl = $('hashProgressStage');
  const fileEl = $('hashProgressFile');
  const percentEl = $('hashProgressPercent');
  const barEl = $('hashProgressBar');
  const noteEl = $('hashProgressNote');
  if(!panel || !stageEl || !fileEl || !percentEl || !barEl || !noteEl) return;
  const safePct = Math.max(0, Math.min(100, Number.isFinite(pct) ? pct : 0));
  panel.classList.add('show');
  panel.classList.toggle('error', !!isError);
  stageEl.textContent = stage || '处理中';
  fileEl.textContent = fileName || '';
  percentEl.textContent = safePct + '%';
  barEl.style.width = safePct + '%';
  noteEl.textContent = note || '文件不会上传服务器，所有计算都在本地浏览器完成。';
}
async function hashHandleFiles(files){
  const fileList = Array.from(files || []);
  const statusEl = $('hashStatus');
  const resultsEl = $('hashResults');
  const sectionEl = $('hashResultsSection');
  if(!fileList.length || !statusEl || !resultsEl || !sectionEl) return;
  resultsEl.innerHTML = '';
  sectionEl.style.display = 'block';
  statusEl.classList.remove('error');
  statusEl.textContent = '正在计算 '+fileList.length+' 个文件...';
  hashUpdateProgress('准备开始', '共 '+fileList.length+' 个文件', 0, '正在准备读取文件，本工具不会上传文件。');
  try{
    for(let i=0;i<fileList.length;i++){
      const file = fileList[i];
      const fileLabel = '文件 '+(i+1)+'/'+fileList.length+'：'+file.name;
      statusEl.textContent = fileLabel+' | 准备读取';
      const hashes = await hashCalculateFileWithProgress(file, function(stage, pct){
        const pctText = Number.isFinite(pct) ? ' '+pct+'%' : '';
        statusEl.textContent = fileLabel+' | '+stage+pctText;
        const overall = Math.round(((i + (Math.max(0, Math.min(100, pct || 0)) / 100)) / fileList.length) * 100);
        hashUpdateProgress(stage, fileLabel, overall, stage+'：'+Math.max(0, Math.min(100, pct || 0))+'%，总进度 '+overall+'%');
      });
      resultsEl.appendChild(hashResultCard(file, hashes));
    }
    statusEl.textContent = '完成：已计算 '+fileList.length+' 个文件';
    hashUpdateProgress('计算完成', '已计算 '+fileList.length+' 个文件', 100, '结果已生成，可复制 MD5。');
  }catch(err){
    statusEl.classList.add('error');
    statusEl.textContent = '计算失败：' + (err && err.message ? err.message : err);
    hashUpdateProgress('计算失败', '', 100, err && err.message ? err.message : String(err), true);
  }
}
function initToolbox(){
  const dropZone = $('hashDropZone');
  const fileInput = $('hashFileInput');
  const resultsEl = $('hashResults');
  if(!dropZone || !fileInput || !resultsEl) return;
  fileInput.onchange = function(event){
    hashHandleFiles(event.target.files);
    event.target.value = '';
  };
  dropZone.ondragover = function(event){
    event.preventDefault();
    dropZone.classList.add('dragging');
  };
  dropZone.ondragleave = function(){ dropZone.classList.remove('dragging'); };
  dropZone.ondrop = function(event){
    event.preventDefault();
    dropZone.classList.remove('dragging');
    hashHandleFiles(event.dataTransfer.files);
  };
  resultsEl.onclick = async function(event){
    const button = event.target.closest('[data-copy]');
    if(!button) return;
    const original = button.textContent;
    try{
      await hashCopyText(button.dataset.copy || '');
      button.textContent = '已复制';
      setTimeout(()=>{ button.textContent = original; }, 1200);
    }catch(e){
      button.textContent = '复制失败';
      setTimeout(()=>{ button.textContent = original; }, 1200);
    }
  };
}

function bugFmtTime(ts){
  if(!ts) return '';
  const d=new Date(ts*1000);
  const pad=n=>String(n).padStart(2,'0');
  return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
}

  $('mfgListStatus').textContent='\u52a0\u8f7d\u4e2d...';
  try{
    const r=await fetch('/api/manufacturer_aliases?q='+encodeURIComponent(q));
    const d=await r.json();
    if(!d.success) throw new Error(d.error||'\u52a0\u8f7d\u5931\u8d25');
    const rows=d.aliases||[];
    $('mfgListStatus').textContent=`\u5171 ${rows.length} \u6761\u8bb0\u5f55`;

function cmpState(prefix){
  const key='_cmp_'+prefix;
  if(!window[key]) window[key]={leftHeaders:[],rightHeaders:[],manualPairs:[],keyPairs:[]};
  return window[key];
}
function cmpOptions(headers, selected){
  return (headers||[]).map(h=>`<option value="${_escH(h)}"${h===selected?' selected':''}>${_escH(h)}</option>`).join('');
}

function cmpLooksLikeManufacturerCol(name){
  return /\u5382\u5546|\u5382\u5bb6|\u5236\u9020\u5546|\u751f\u4ea7\u5382\u5bb6|\u4f9b\u5e94\u5546|brand|manufacturer|maker/i.test(name||'');
}
function cmpDefaultKeyPairs(prefix){
  const st=cmpState(prefix);
  if(prefix!=='cust') return [];
  const left=st.leftHeaders||[], right=st.rightHeaders||[];
  const pick=(headers, patterns)=>headers.find(h=>patterns.some(p=>p.test(h||'')))||'';
  const leftModel=pick(left, [/\u89c4\u683c\u578b\u53f7/, /\u578b\u53f7/, /part\s*number/i, /model/i]);
  const rightModel=pick(right, [/\u578b\u53f7/, /\u89c4\u683c\u578b\u53f7/, /part\s*number/i, /model/i]);
  const leftMaker=pick(left, [/\u5382\u5546/, /\u5382\u5bb6/, /\u5236\u9020\u5546/, /\u751f\u4ea7\u5382\u5bb6/, /\u4f9b\u5e94\u5546/, /brand/i, /manufacturer/i, /maker/i]);
  const rightMaker=pick(right, [/\u751f\u4ea7\u5382\u5bb6/, /\u5382\u5546/, /\u5382\u5bb6/, /\u5236\u9020\u5546/, /\u4f9b\u5e94\u5546/, /brand/i, /manufacturer/i, /maker/i]);
  const rows=[];
  if(leftModel&&rightModel) rows.push({left:leftModel,right:rightModel,transform:''});
  if(leftMaker&&rightMaker) rows.push({left:leftMaker,right:rightMaker,transform:'manufacturer_alias'});
  return rows.length?rows:[{left:left[0]||'',right:right[0]||'',transform:''}];
}
function cmpEnsureKeyPairs(prefix){
  const st=cmpState(prefix);
  if(prefix!=='cust') return;
  st.keyPairs=(st.keyPairs||[]).filter(p=>p.left||p.right);
  if(!st.keyPairs.length) st.keyPairs=cmpDefaultKeyPairs(prefix);
  if(!st.keyPairs.length) st.keyPairs=[{left:'',right:'',transform:''}];
}
function cmpRenderKeyPairs(prefix){
  if(prefix!=='cust' || !$(prefix+'KeyRows')) return;
  const st=cmpState(prefix);
  cmpEnsureKeyPairs(prefix);
  const left=st.leftHeaders||[], right=st.rightHeaders||[];
  $(prefix+'KeyRows').innerHTML=(st.keyPairs||[]).map((pair,i)=>{
    const showMap=cmpLooksLikeManufacturerCol(pair.left);
    const checked=pair.transform==='manufacturer_alias'?' checked':'';
    return `<div class="row" style="margin:0">
      <label style="min-width:90px">\u5339\u914d\u952e${i+1}\uff1a</label>

async function cmpRefresh(prefix, compareType, apiPrefix='/api/bom_compare'){
  const leftFile=$(prefix+'LeftFile').files[0], rightFile=$(prefix+'RightFile').files[0];
  const st=cmpState(prefix);
  st.leftHeaders=[];st.rightHeaders=[];st.manualPairs=[];st.keyPairs=[];
  if($(prefix+'LeftKey')) clearSelectOptions(prefix+'LeftKey','加载中...');
  if($(prefix+'RightKey')) clearSelectOptions(prefix+'RightKey','加载中...');
  if($(prefix+'CommonPairs')) $(prefix+'CommonPairs').innerHTML=excelLoadingHtml('正在读取两份 Excel 列...');
  if($(prefix+'ManualPairs')) $(prefix+'ManualPairs').innerHTML='';
  hide($(prefix+'Result'));clearInlineError(prefix+'Error');
  if(!leftFile||!rightFile){
    $(prefix+'LoadStatus').textContent='';
    if($(prefix+'CommonPairs')) $(prefix+'CommonPairs').innerHTML='<span style="font-size:12px;color:#888">请先上传两份 BOM 文件</span>';
    return;
  }
  setLoadingStatus(prefix+'LoadStatus','正在读取列...');
  const fd=new FormData();
  fd.append('left_file',leftFile);fd.append('right_file',rightFile);fd.append('compare_type',compareType||'cadence_hq');
  fd.append('left_header_row',$(prefix+'LeftHdr').value||1);fd.append('right_header_row',$(prefix+'RightHdr').value||1);
  const ls=$(prefix+'LeftSheet').value, rs=$(prefix+'RightSheet').value;
  if(ls&&ls!=='先选择文件'&&ls!=='加载中...') fd.append('left_sheet',ls);
  if(rs&&rs!=='先选择文件'&&rs!=='加载中...') fd.append('right_sheet',rs);
  try{
    const d=await postFormJson(apiPrefix+'/generic_sheets',fd);
    if(!d.success) throw new Error(d.error||'读取列失败');
    $(prefix+'LeftSheet').innerHTML=(d.left_sheets||[]).map(s=>`<option${s===d.left_current_sheet?' selected':''}>${_escH(s)}</option>`).join('');
    $(prefix+'RightSheet').innerHTML=(d.right_sheets||[]).map(s=>`<option${s===d.right_current_sheet?' selected':''}>${_escH(s)}</option>`).join('');
    st.leftHeaders=d.left_headers||[];st.rightHeaders=d.right_headers||[];
    st.leftFormat=d.left_format||'';st.rightFormat=d.right_format||'';st.rightBomSheets=d.right_bom_sheets||[];
    if(d.left_header_row) $(prefix+'LeftHdr').value=d.left_header_row;
    if(d.right_header_row) $(prefix+'RightHdr').value=d.right_header_row;
    if($(prefix+'LeftKey')) $(prefix+'LeftKey').innerHTML=cmpOptions(st.leftHeaders,d.detected_left_key||d.left_detected_key);
    if($(prefix+'RightKey')) $(prefix+'RightKey').innerHTML=cmpOptions(st.rightHeaders,d.detected_right_key||d.right_detected_key);
    cmpPopulateCustomerStandardMapping(prefix);
    cmpRenderKeyPairs(prefix);
    cmpRenderPairs(prefix);
    const rightFmt=st.rightFormat==='plm_full'?'PLM 全量 BOM':'标准 HQ BOM';
    const rightSheetHint=st.rightFormat==='plm_full'?`，HQ 已识别 ${rightFmt}（${(st.rightBomSheets||[]).join('、')}）`:`，HQ 已识别 ${rightFmt}`;
    setPlainStatus(prefix+'LoadStatus',`已加载：左侧 ${st.leftHeaders.length} 列，右侧 ${st.rightHeaders.length} 列${rightSheetHint}`);
  }catch(e){
    if($(prefix+'CommonPairs')) $(prefix+'CommonPairs').innerHTML='<span style="font-size:12px;color:#888">列读取失败</span>';
    $(prefix+'LoadStatus').textContent='';showInlineError(prefix+'Error',e.message,prefix+'Status');
  }
}
function cmpCollectPairs(prefix){
  const pairs=[];
  document.querySelectorAll('#'+prefix+'CommonPairs input[type="checkbox"]:checked').forEach(x=>pairs.push({left:x.value,right:x.value}));
  (cmpState(prefix).manualPairs||[]).forEach(p=>{if(p.left&&p.right)pairs.push({left:p.left,right:p.right});});
  const seen=new Set();
  return pairs.filter(p=>{const k=p.left+'\u0000'+p.right;if(seen.has(k))return false;seen.add(k);return true;});
}
function initGenericBomCompare(prefix, compareType, apiPrefix='/api/bom_compare'){
  cmpState(prefix);
  $(prefix+'Refresh').onclick=()=>cmpRefresh(prefix,compareType,apiPrefix);
  $(prefix+'LeftFile').onchange=()=>cmpRefresh(prefix,compareType,apiPrefix);

  $(prefix+'RightSheet').onchange=()=>cmpRefresh(prefix,compareType,apiPrefix);

  $(prefix+'RightHdr').onchange=()=>cmpRefresh(prefix,compareType,apiPrefix);
  if($(prefix+'LeftKey')) $(prefix+'LeftKey').onchange=()=>{cmpRenderKeyPairs(prefix);cmpRenderPairs(prefix);};
  if($(prefix+'RightKey')) $(prefix+'RightKey').onchange=()=>{cmpRenderKeyPairs(prefix);cmpRenderPairs(prefix);};
  if($(prefix+'SelectAll')) $(prefix+'SelectAll').onclick=()=>document.querySelectorAll('#'+prefix+'CommonPairs input[type="checkbox"]').forEach(x=>x.checked=true);
  if($(prefix+'SelectNone')) $(prefix+'SelectNone').onclick=()=>document.querySelectorAll('#'+prefix+'CommonPairs input[type="checkbox"]').forEach(x=>x.checked=false);
  if($(prefix+'AddPair')) $(prefix+'AddPair').onclick=()=>{const st=cmpState(prefix);st.manualPairs.push({left:'',right:''});cmpRenderManualPairs(prefix);};
  if($(prefix+'AddKey')) $(prefix+'AddKey').onclick=()=>{const st=cmpState(prefix);cmpEnsureKeyPairs(prefix);st.keyPairs.push({left:'',right:'',transform:''});cmpRenderKeyPairs(prefix);cmpRenderPairs(prefix);};
  $(prefix+'Run').onclick=async function(){
    const leftFile=$(prefix+'LeftFile').files[0], rightFile=$(prefix+'RightFile').files[0];
    if(!leftFile||!rightFile){showInlineError(prefix+'Error','请上传两份 BOM 文件',prefix+'Status');return;}
    let fieldPairs=cmpCollectPairs(prefix);
    const keyCfg=cmpCollectKeyConfig(prefix);
    if(!keyCfg.left_key_cols.length||!keyCfg.right_key_cols.length){showInlineError(prefix+'Error','请先加载列并选择两侧匹配键',prefix+'Status');return;}
    if(!fieldPairs.length){showInlineError(prefix+'Error','请至少选择一组需要比对的字段',prefix+'Status');return;}
    const btn=$(prefix+'Run');btn.disabled=true;$(prefix+'Status').textContent='正在比对...';hide($(prefix+'Result'));clearInlineError(prefix+'Error');
    const cfg={compare_type:compareType,left_sheet:$(prefix+'LeftSheet').value,right_sheet:$(prefix+'RightSheet').value,
      left_header_row:parseInt($(prefix+'LeftHdr').value)||1,right_header_row:parseInt($(prefix+'RightHdr').value)||1,
      left_key_col:keyCfg.left_key_cols[0]||'',right_key_col:keyCfg.right_key_cols[0]||'',
      left_key_cols:keyCfg.left_key_cols,right_key_cols:keyCfg.right_key_cols,left_key_transforms:keyCfg.left_key_transforms,
      field_pairs:fieldPairs};
    const fd=new FormData();fd.append('left_file',leftFile);fd.append('right_file',rightFile);fd.append('config',JSON.stringify(cfg));
    try{
      const d=await postFormJson(apiPrefix+'/generic',fd);
      if(!d.success) throw new Error(d.error||'比对失败');
      const leftName='Cadence BOM';
      const rightName='HQ BOM';
      const expandHint=d.expanded_refdes?'<br>已按位号展开逐点比对':'';
      const diffText=false
        ? `制造商差异 <b style="color:#c07000">${d.manufacturer_diff||0}</b> | 型号差异 <b style="color:#c00000">${d.model_diff||0}</b> | 二供差异 <b style="color:#c07000">${d.second_source_diff||0}</b>`
        : `字段变更 <b style="color:#c07000">${d.changed}</b>`;
      const leftOnlyLabel=false?'仅客户BOM存在':`${leftName} 独有`;
      const rightOnlyLabel=false?'仅HQ BOM存在':`${rightName} 独有`;
      $(prefix+'Stats').innerHTML=`${leftOnlyLabel} <b style="color:#c00000">${d.left_only}</b> | ${rightOnlyLabel} <b style="color:#2a8a2a">${d.right_only}</b> | ${diffText} | 完全一致 <b>${d.same}</b><br>${leftName} 共 ${d.left_total} 行，${rightName} 共 ${d.right_total} 行${expandHint}`;
      $(prefix+'Dl').href=d.download;show($(prefix+'Result'));$(prefix+'Status').textContent='完成';
    }catch(e){showInlineError(prefix+'Error',e.message,prefix+'Status');}
    btn.disabled=false;
  };
}

}

async function vcLoadOne(prefix, which, sheetsApi){
  const fileEl=$(which==='old'?prefix+'OldFile':prefix+'NewFile');
  const sheetEl=$(which==='old'?prefix+'OldSheet':prefix+'NewSheet');
  const f=fileEl.files[0]; if(!f) return null;
  const fd=new FormData();
  fd.append('file',f);
  fd.append('header_row',$(prefix+'Hdr').value||1);
  if(sheetEl.value && sheetEl.value!=='先选择文件' && sheetEl.value!=='加载中...') fd.append('sheet_name',sheetEl.value);
  const r=await fetch(sheetsApi,{method:'POST',body:fd});
  const d=await r.json();
  if(!d.success) throw new Error(d.error||'读取文件失败');
  sheetEl.innerHTML=(d.sheets||[]).map(s=>`<option${s===d.current_sheet?' selected':''}>${_escH(s)}</option>`).join('');
  const st=vcState(prefix);
  if(which==='old'){st.oldHeaders=d.headers||[];st.oldFormat=d.format||'';st.oldBomSheets=d.bom_sheets||[];}
  else {st.newHeaders=d.headers||[];st.newFormat=d.format||'';st.newBomSheets=d.bom_sheets||[];}
  if(d.header_row) $(prefix+'Hdr').value=d.header_row;
  return d;
}

async function vcRefreshColumns(prefix, opts){
  clearInlineError(prefix+'Error');hide($(prefix+'Result'));
  const st=vcState(prefix); st.oldHeaders=[];st.newHeaders=[];st.oldFormat='';st.newFormat='';st.oldBomSheets=[];st.newBomSheets=[];
  clearSelectOptions(prefix+'KeyCol','加载中...');
  $(prefix+'CompareCols').innerHTML=excelLoadingHtml('正在读取两份 HQ BOM 列...');
  setLoadingStatus(prefix+'LoadStatus','读取列中...');
  try{
    const oldData=await vcLoadOne(prefix,'old',opts.sheetsApi);
    const newData=await vcLoadOne(prefix,'new',opts.sheetsApi);
    const common=st.oldHeaders.filter(h=>h && st.newHeaders.includes(h));
    const keySel=$(prefix+'KeyCol');
    keySel.innerHTML=common.map(h=>`<option value="${_escH(h)}">${_escH(h)}</option>`).join('');
    const detected=(oldData&&newData&&oldData.detected_key===newData.detected_key)?oldData.detected_key:(oldData?.detected_key||newData?.detected_key||'');
    if(detected && common.includes(detected)) keySel.value=detected;
    vcRenderCompareCols(prefix, opts);
    const fmtLabel=st.oldFormat==='plm_full'?'PLM 全量 BOM':'标准 HQ BOM';
    const sheetHint=st.oldFormat==='plm_full'?`；将比对 ${((st.oldBomSheets||[]).filter(s=>(st.newBomSheets||[]).includes(s))).join('、')}`:'';
    setPlainStatus(prefix+'LoadStatus',`已识别：${fmtLabel}，已加载共同列 ${common.length} 个${sheetHint}`);
  }catch(e){
    $(prefix+'CompareCols').innerHTML='<span style="font-size:12px;color:#888">列读取失败</span>';
    $(prefix+'LoadStatus').textContent='';
    showInlineError(prefix+'Error',e.message,prefix+'Status');
  }
}

  vcState(prefix);

    try{

function plmColToIndex(col){
  const s=String(col||'').trim().toUpperCase();
  if(!s) return null;
  if(/^\d+$/.test(s)) return parseInt(s,10);
  let n=0;
  for(const ch of s){
    if(ch<'A'||ch>'Z') return null;
    n=n*26+(ch.charCodeAt(0)-64);
  }
  return n;
}

function plmIndexToCol(n){
  n=parseInt(n,10);
  let s='';
  while(n>0){
    const m=(n-1)%26;
    s=String.fromCharCode(65+m)+s;
    n=Math.floor((n-1)/26);
  }
  return s;
}

function plmGetCellText(row, col){
  const idx=plmColToIndex(col);
  if(!idx || !window._plmPreviewHeaders) return '';
  return window._plmPreviewHeaders[idx-1] || '';
}

function plmDefaultNameRow(){
  const hdr=parseInt($('plmHdr')?.value)||4;
  return Math.max(1, hdr-1);
}

function plmSetQtyConfigs(configs){
  window._plmQtyConfigs=(configs||[]).map(cfg=>({
    name_row: cfg.name_row || plmDefaultNameRow(),
    name: cfg.name || '',
    qty_col: cfg.qty_col || '',
  }));
  plmRenderQtyConfigs();
  plmRefreshQtyConfigNames(false);
}

function plmRenderQtyConfigs(){
  const body=$('plmQtyCfgBody');
  if(!body) return;
  const cfgs=window._plmQtyConfigs||[];
  body.innerHTML=cfgs.map((cfg,i)=>`
    <tr>
      <td><input type="number" min="1" value="${cfg.name_row||plmDefaultNameRow()}" style="width:80px" onchange="plmUpdateQtyCfg(${i},'name_row',this.value);plmRefreshOneQtyName(${i},true)"></td>
      <td><input type="text" value="${_escH(cfg.name||'')}" style="width:100%" placeholder="自动读取，可手动修改" onchange="plmUpdateQtyCfg(${i},'name',this.value)"></td>
      <td><input type="text" value="${_escH(cfg.qty_col||'')}" style="width:64px" placeholder="如 K" onchange="plmUpdateQtyCfg(${i},'qty_col',this.value);plmRefreshOneQtyName(${i},true)"></td>
      <td><button class="btn btn-sm btn-gray" type="button" onclick="plmRemoveQtyCfg(${i})">删除</button></td>
    </tr>`).join('');
}

function plmUpdateQtyCfg(i,key,val){
  window._plmQtyConfigs=window._plmQtyConfigs||[];
  if(!window._plmQtyConfigs[i]) return;
  window._plmQtyConfigs[i][key]=key==='qty_col'?String(val||'').trim().toUpperCase():val;
}

function plmRefreshOneQtyName(i,force){
  const cfg=(window._plmQtyConfigs||[])[i];
  if(!cfg || (!force && cfg.name)) return;
  const row=parseInt(cfg.name_row)||plmDefaultNameRow();
  const col=cfg.qty_col;
  const f=$('plmFile')?.files?.[0];
  if(!f || !col) {
    cfg.name = cfg.name || (col ? `用量${col}` : '');
    plmRenderQtyConfigs();
    return;
  }
  const fd=new FormData();
  fd.append('file',f);
  fd.append('sheet_name',$('plmSheet').value);
  fd.append('header_row',row);
  fetch('/api/plm/detect',{method:'POST',body:fd}).then(r=>r.json()).then(d=>{
    if(d.success){
      const idx=plmColToIndex(col);
      const name=(d.preview_headers||[])[idx-1] || '';
      cfg.name = name || `用量${col}`;
      plmRenderQtyConfigs();
    }
  });
}

function plmRefreshQtyConfigNames(force){
  (window._plmQtyConfigs||[]).forEach((_,i)=>plmRefreshOneQtyName(i,force));
}

function plmAddQtyCfg(){
  window._plmQtyConfigs=window._plmQtyConfigs||[];
  const last=window._plmQtyConfigs[window._plmQtyConfigs.length-1];
  const lastIdx=plmColToIndex(last?.qty_col);
  const nextCol=lastIdx?plmIndexToCol(lastIdx+1):'';
  window._plmQtyConfigs.push({name_row:plmDefaultNameRow(),name:'',qty_col:nextCol});
  plmRenderQtyConfigs();
  plmRefreshOneQtyName(window._plmQtyConfigs.length-1,true);
}

function plmRemoveQtyCfg(i){
  window._plmQtyConfigs=(window._plmQtyConfigs||[]).filter((_,idx)=>idx!==i);
  plmRenderQtyConfigs();
}

function plmSetQtyNameRow(row){
  window._plmQtyConfigs=window._plmQtyConfigs||[];
  window._plmQtyConfigs.forEach(cfg=>{cfg.name_row=row; cfg.name='';});
  plmRenderQtyConfigs();
  plmRefreshQtyConfigNames(true);
}

function plmCollectQtyConfigs(){
  return (window._plmQtyConfigs||[])
    .map(cfg=>({name_row:parseInt(cfg.name_row)||plmDefaultNameRow(), name:String(cfg.name||'').trim(), qty_col:String(cfg.qty_col||'').trim().toUpperCase()}))
    .filter(cfg=>cfg.qty_col);
}
