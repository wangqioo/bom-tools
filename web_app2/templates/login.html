<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BOM Tools 登录</title>
<style>
* { box-sizing:border-box; margin:0; padding:0; }
body { min-height:100vh; display:flex; align-items:center; justify-content:center; background:#eef2f7; font-family:-apple-system,'Segoe UI','Microsoft YaHei',sans-serif; color:#1f2937; }
.login-panel { width:min(380px, calc(100vw - 32px)); background:#fff; border:1px solid #dbe3ef; border-radius:8px; box-shadow:0 8px 24px rgba(31,41,55,.10); padding:24px; }
.brand { margin-bottom:20px; }
.brand h1 { font-size:22px; color:#163a6b; margin-bottom:4px; }
.brand p { font-size:13px; color:#667085; }
.field { margin-bottom:14px; }
.field label { display:block; font-size:13px; font-weight:600; color:#344054; margin-bottom:6px; }
.field input { width:100%; height:38px; border:1px solid #c8d0dc; border-radius:6px; padding:7px 10px; font-size:14px; outline:none; }
.field input:focus { border-color:#2d6cdf; box-shadow:0 0 0 3px rgba(45,108,223,.12); }
.hidden { display:none; }
.btn { width:100%; height:38px; border:0; border-radius:6px; background:#2d6cdf; color:#fff; font-size:14px; font-weight:700; cursor:pointer; }
.btn:disabled { background:#9bb8e8; cursor:not-allowed; }
.msg { min-height:20px; margin-top:12px; font-size:13px; color:#cf1322; }
.note { min-height:20px; margin:-4px 0 12px; font-size:12px; color:#475467; }
.hint { margin-top:14px; padding-top:12px; border-top:1px solid #edf1f7; font-size:12px; color:#667085; line-height:1.6; }
</style>
</head>
<body>
<main class="login-panel">
  <div class="brand">
    <h1>BOM Tools</h1>
    <p>硬件设计辅助平台</p>
  </div>
  <form id="loginForm">
    <div class="field">
      <label for="employeeId">工号</label>
      <input id="employeeId" name="employee_id" type="text" autocomplete="username" required autofocus>
    </div>
    <div class="field hidden" id="nameField">
      <label for="displayName">姓名</label>
      <input id="displayName" name="display_name" type="text" autocomplete="name">
    </div>
    <div class="note" id="note"></div>
    <button class="btn" id="loginBtn" type="submit">进入系统</button>
    <div class="msg" id="msg"></div>
  </form>
  <div class="hint">已有用户只需输入工号。首次注册需要填写姓名；管理员工号通过环境变量 BOM_TOOLS_ADMIN_EMPLOYEE_IDS 配置。</div>
</main>
<script>
const form = document.getElementById('loginForm');
const btn = document.getElementById('loginBtn');
const msg = document.getElementById('msg');
const note = document.getElementById('note');
const nameField = document.getElementById('nameField');
const displayName = document.getElementById('displayName');
let collectingName = false;

function showNameField() {
  collectingName = true;
  nameField.classList.remove('hidden');
  displayName.required = true;
  btn.textContent = '完成注册并进入';
  note.textContent = '该工号首次使用，请补充姓名完成注册。';
  displayName.focus();
}

form.addEventListener('submit', async (event) => {
  event.preventDefault();
  msg.textContent = '';
  btn.disabled = true;
  try {
    const body = {employee_id: document.getElementById('employeeId').value.trim()};
    if (collectingName) body.display_name = displayName.value.trim();
    const resp = await fetch('/api/login', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify(body),
    });
    const data = await resp.json();
    if (data.need_name) {
      showNameField();
      return;
    }
    if (!data.success) throw new Error(data.error || '登录失败');
    const params = new URLSearchParams(location.search);
    location.href = params.get('next') || '/';
  } catch (err) {
    msg.textContent = err.message || '登录失败';
  } finally {
    btn.disabled = false;
  }
});
</script>
</body>
</html>
