<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CSA 几何检查 — BOM Tools</title>
<link rel="stylesheet" href="/static/style.css">
<style>
table.results { margin-top: 16px; width: 100%; border-collapse: collapse; font-size: 13px; }
table.results th, table.results td { padding: 6px 10px; text-align: center; border: 1px solid #ddd; }
table.results th { background: #1F4E79; color: #fff; font-weight: 600; }
table.results td { white-space: nowrap; }
table.results td.wrap { white-space: normal; max-width: 300px; }
.cross { color: #e07000; font-weight: bold; }
.ok { color: #2a8a2a; }
.circle-warn { color: #c55a11; }
.detail-section { margin-top: 20px; }
.detail-section h4 { margin: 12px 0 6px; padding: 6px 12px; background: #eee; border-radius: 4px; cursor: pointer; user-select: none; }
.detail-section h4:hover { background: #ddd; }
.detail-section h4 .toggle-icon { margin-right: 6px; }
.detail-section .detail-body { display: none; }
.detail-section .detail-body.open { display: block; }
.opt-row { display: flex; align-items: center; gap: 16px; margin-top: 8px; flex-wrap: wrap; }
.opt-row label { font-size: 13px; cursor: pointer; }
.opt-row select { padding: 3px 6px; font-size: 13px; }
.btn { display: inline-flex; align-items: center; gap: 4px; padding: 6px 16px; border: none; border-radius: 4px; cursor: pointer; font-size: 14px; }
.btn-primary { background: #1F4E79; color: #fff; }
.btn-primary:hover { background: #163a5c; }
.btn-secondary { background: #595959; color: #fff; margin-left: 8px; }
.btn-secondary:hover { background: #404040; }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.status-msg { margin-left: 12px; font-size: 13px; color: #888; }
.result-box table + table { margin-top: 20px; }
.tabs { display: flex; gap: 0; margin-top: 16px; border-bottom: 2px solid #1F4E79; }
.tab-btn { padding: 8px 20px; border: none; background: #f5f5f5; cursor: pointer; font-size: 13px; border-radius: 4px 4px 0 0; }
.tab-btn.active { background: #1F4E79; color: #fff; }
.tab-btn:hover:not(.active) { background: #e8e8e8; }
.tab-content { display: none; }
.tab-content.active { display: block; }
.scroll-table { max-height: 400px; overflow-y: auto; }
.scroll-table table { margin-top: 0; }
.scroll-table thead th { position: sticky; top: 0; z-index: 1; }
</style>
</head>
<body>
<header>
  <h1>📐 CSA 几何规范检查</h1>
  <p>扫描 sch_1/page*.csa → DOT 四向十字交叉 / 画圈对象 / 信号名检测</p>
</header>
<div class="container">
  <div class="breadcrumb"><a href="/">← 返回首页</a></div>

  <div class="form-card">
    <h2>上传 CSA 文件</h2>
    <form id="csaForm" enctype="multipart/form-data">
      <div class="form-row">
        <label>page*.csa：</label>
        <input type="file" name="files" accept=".csa" multiple required style="min-width:350px">
        <span style="font-size:12px;color:#888">可多选 page1.csa、page2.csa…（按住Ctrl多选）</span>
      </div>
      <div class="opt-row">
        <label><input type="checkbox" name="include_arcs" value="1" checked> 包含 ARC 拟合圆检测（需人工确认）</label>
        <label>CIRCLE 解析模式：
          <select name="circle_mode">
            <option value="center_radius">center_radius</option>
            <option value="bbox">bbox</option>
          </select>
        </label>
      </div>
      <div style="margin-top:12px">
        <button type="submit" class="btn btn-primary">⚡ 开始分析</button>
        <span class="status-msg" id="status"></span>
        <button type="button" class="btn btn-secondary" id="csvBtn" style="display:none">📥 导出 CSV</button>
      </div>
    </form>
  </div>

  <div class="result-box" id="result">
    <h3>✅ 检查结果</h3>
    <div class="stat-grid">
      <div class="stat-item"><div class="num" id="s-pages">-</div><div class="lbl">页面数</div></div>
      <div class="stat-item"><div class="num" id="s-crosses">-</div><div class="lbl">四向十字</div></div>
      <div class="stat-item"><div class="num" id="s-circles">-</div><div class="lbl">画圈对象</div></div>
      <div class="stat-item"><div class="num" id="s-errors">-</div><div class="lbl">异常页面</div></div>
    </div>

    <div class="tabs">
      <button class="tab-btn active" data-tab="tab-summary">📋 概览</button>
      <button class="tab-btn" data-tab="tab-cross">✛ 四向十字</button>
      <button class="tab-btn" data-tab="tab-circle">⭕ 画圈对象</button>
    </div>

    <!-- 概览 Tab -->
    <div class="tab-content active" id="tab-summary">
      <div class="scroll-table">
        <table class="results">
          <thead><tr>
            <th>页面</th><th>CSA页名</th><th>文件</th>
            <th>四向十字</th><th>画圈对象</th><th>WIRE数</th><th>DOT数</th><th>错误</th>
          </tr></thead>
          <tbody id="summaryBody"></tbody>
        </table>
      </div>
    </div>

    <!-- 十字 Tab -->
    <div class="tab-content" id="tab-cross">
      <div class="scroll-table">
        <table class="results">
          <thead><tr>
            <th>页面</th><th>CSA页名</th><th>文件</th><th>序号</th>
            <th>坐标</th><th>X</th><th>Y</th><th>DOT行号</th>
            <th>水平WIRE行号</th><th>垂直WIRE行号</th><th>关联信号</th><th>说明</th>
          </tr></thead>
          <tbody id="crossBody"></tbody>
        </table>
      </div>
    </div>

    <!-- 画圈 Tab -->
    <div class="tab-content" id="tab-circle">
      <div class="scroll-table">
        <table class="results">
          <thead><tr>
            <th>页面</th><th>CSA页名</th><th>文件</th><th>序号</th>
            <th>对象类型</th><th>行号</th><th>圆心</th><th>半径</th><th>直径</th>
            <th>外接框</th><th>宽</th><th>高</th><th>解析说明</th>
          </tr></thead>
          <tbody id="circleBody"></tbody>
        </table>
      </div>
    </div>
  </div>

  <div class="error-msg" id="error"></div>
</div>

<script>
let _csvKey = null;

document.querySelectorAll('.tab-btn').forEach(btn => {
  btn.addEventListener('click', function() {
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
    this.classList.add('active');
    document.getElementById(this.dataset.tab).classList.add('active');
  });
});

document.getElementById('csaForm').onsubmit = async function(e) {
  e.preventDefault();
  const filesInput = document.querySelector('input[name="files"]');
  if (!filesInput.files.length) { alert('请上传 page*.csa 文件'); return; }

  const btn = this.querySelector('button[type="submit"]'); btn.disabled = true;
  document.getElementById('status').textContent = '分析中...';
  document.getElementById('result').classList.remove('show');
  document.getElementById('error').classList.remove('show');
  document.getElementById('csvBtn').style.display = 'none';
  _csvKey = null;

  const fd = new FormData(this);

  try {
    const r = await fetch('/csa', { method: 'POST', body: fd });
    const d = await r.json();
    if (d.success) {
      document.getElementById('s-pages').textContent = d.pages;
      document.getElementById('s-crosses').textContent = d.total_crosses;
      document.getElementById('s-circles').textContent = d.total_circles;
      document.getElementById('s-errors').textContent = d.total_errors;
      _csvKey = d.csv_key;

      // 概览表
      let sumHtml = '';
      d.results.forEach(r => {
        const cls = r.cross_count > 0 ? 'cross' : 'ok';
        const err = r.error ? '⚠ ' + r.error : '';
        sumHtml += `<tr>
          <td>${r.page_label}</td><td>${r.page_name}</td><td>${r.relative_file}</td>
          <td class="${cls}">${r.cross_count}</td>
          <td class="${r.circle_count > 0 ? 'circle-warn' : 'ok'}">${r.circle_count}</td>
          <td>${r.wire_count}</td><td>${r.dot_count}</td>
          <td>${err || '✅'}</td>
        </tr>`;
      });
      document.getElementById('summaryBody').innerHTML = sumHtml;

      // 十字详细表
      let crossHtml = '';
      d.results.forEach(r => {
        (r.findings || []).forEach((item, idx) => {
          crossHtml += `<tr>
            <td>${r.page_label}</td><td>${r.page_name}</td><td>${r.relative_file}</td>
            <td>${idx + 1}</td>
            <td>(${item.x},${item.y})</td><td>${item.x}</td><td>${item.y}</td>
            <td>${item.dot_line}</td>
            <td class="wrap">${item.h_wire_lines || ''}</td>
            <td class="wrap">${item.v_wire_lines || ''}</td>
            <td class="wrap">${item.labels || ''}</td>
            <td class="wrap">${item.detail || ''}</td>
          </tr>`;
        });
      });
      if (!crossHtml) crossHtml = '<tr><td colspan="12" style="text-align:center;color:#888">未发现四向十字</td></tr>';
      document.getElementById('crossBody').innerHTML = crossHtml;

      // 画圈详细表
      let circleHtml = '';
      d.results.forEach(r => {
        (r.circles || []).forEach((item, idx) => {
          const cx = typeof item.center_x === 'number' ? item.center_x.toFixed(item.center_x % 1 === 0 ? 0 : 2) : item.center_x;
          const cy = typeof item.center_y === 'number' ? item.center_y.toFixed(item.center_y % 1 === 0 ? 0 : 2) : item.center_y;
          circleHtml += `<tr>
            <td>${r.page_label}</td><td>${r.page_name}</td><td>${r.relative_file}</td>
            <td>${idx + 1}</td>
            <td>${item.object_type}</td><td>${item.line_no}</td>
            <td>(${cx},${cy})</td>
            <td>${item.radius}</td><td>${item.diameter}</td>
            <td class="wrap">(${item.bbox_xmin},${item.bbox_ymin})-(${item.bbox_xmax},${item.bbox_ymax})</td>
            <td>${item.width}</td><td>${item.height}</td>
            <td class="wrap">${item.parse_note || ''}</td>
          </tr>`;
        });
      });
      if (!circleHtml) circleHtml = '<tr><td colspan="13" style="text-align:center;color:#888">未发现画圈对象</td></tr>';
      document.getElementById('circleBody').innerHTML = circleHtml;

      document.getElementById('result').classList.add('show');
      document.getElementById('status').textContent = '分析完成！';
      document.getElementById('csvBtn').style.display = 'inline-flex';
    } else {
      document.getElementById('error').textContent = d.error || '检查失败';
      document.getElementById('error').classList.add('show');
      document.getElementById('status').textContent = '';
    }
  } catch (err) {
    document.getElementById('error').textContent = '网络错误：' + err.message;
    document.getElementById('error').classList.add('show');
    document.getElementById('status').textContent = '';
  }
  btn.disabled = false;
};

document.getElementById('csvBtn').addEventListener('click', function() {
  if (_csvKey) {
    window.location.href = '/csa_export_csv/' + _csvKey;
  }
});
</script>
</body>
</html>
