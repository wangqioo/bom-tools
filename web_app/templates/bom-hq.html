<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>整机BOM配置表</title>
<link rel="stylesheet" href="/static/style.css">
<style>
:root{--primary:#1a73e8;--bg:#f8f9fa;--card:#fff;--border:#dadce0;--text:#202124;--text2:#5f6368;--green:#34a853;--amber:#fbbc04;--red:#ea4335;--radius:8px}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;background:var(--bg);color:var(--text);line-height:1.6}
.container{max-width:1100px;margin:0 auto;padding:20px}
h1{font-size:1.6rem;margin-bottom:6px}
h2{font-size:1.1rem;margin-bottom:12px;color:var(--text2)}
.steps{display:flex;gap:6px;margin:20px 0;font-size:0.85rem}
.step{flex:1;padding:10px;text-align:center;background:#e8eaed;border-radius:var(--radius);color:var(--text2);font-weight:500}
.step.active{background:var(--primary);color:#fff}
.step.done{background:var(--green);color:#fff}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:16px}
.card h3{font-size:1rem;margin-bottom:12px;color:var(--text2)}
label{display:block;font-size:0.85rem;font-weight:500;margin:8px 0 4px;color:var(--text2)}
input,select{width:100%;padding:8px 10px;border:1px solid var(--border);border-radius:6px;font-size:0.9rem}
input:focus,select:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 2px rgba(26,115,232,0.15)}
.btn{padding:8px 20px;border:none;border-radius:6px;font-size:0.9rem;cursor:pointer;font-weight:500}
.btn-primary{background:var(--primary);color:#fff}
.btn-primary:hover{background:#1557b0}
.btn-primary:disabled{opacity:0.5;cursor:not-allowed}
.btn-success{background:var(--green);color:#fff}
.btn-danger{background:var(--red);color:#fff}
.form-row{display:flex;gap:12px;flex-wrap:wrap;margin:10px 0}
.form-group{flex:1 1 200px}
.form-actions{margin-top:16px;display:flex;gap:10px;align-items:center}
table{width:100%;border-collapse:collapse;font-size:0.8rem}
th,td{border:1px solid var(--border);padding:4px 6px;text-align:left;white-space:nowrap}
th{background:#f1f3f4;font-weight:600;position:sticky;top:0}
.preview-wrap{max-height:300px;overflow:auto;border:1px solid var(--border);border-radius:6px}
.detected-badge{display:inline-block;padding:1px 6px;border-radius:4px;font-size:0.75rem;font-weight:600;margin-left:4px;color:#fff}
.badge-A{background:#7b1fa2}
.badge-B{background:#e65100}
.badge-C{background:#1565c0}
.badge-qty{background:var(--green)}
.badge-name{background:var(--primary)}
.scan-result{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:8px;margin-top:8px}
.scan-item{display:flex;justify-content:space-between;align-items:center;padding:6px 10px;background:#f8f9fa;border-radius:6px;font-size:0.85rem}
.scan-item .role{font-weight:600}
.scan-item .col-letter{font-family:monospace;background:var(--primary);color:#fff;padding:0 6px;border-radius:3px;font-size:0.75rem}
.scan-item .samples{color:var(--text2);font-size:0.75rem;max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.loading{text-align:center;padding:40px;color:var(--text2)}
.spinner{width:24px;height:24px;border:3px solid var(--border);border-top-color:var(--primary);border-radius:50%;animation:spin .8s linear infinite;display:inline-block;vertical-align:middle;margin-right:8px}
@keyframes spin{to{transform:rotate(360deg)}}
.alert{padding:10px 14px;border-radius:6px;margin:12px 0;font-size:0.85rem;display:none}
.alert-error{background:#fce8e6;color:var(--red);border:1px solid var(--red)}
.alert-success{background:#e6f4ea;color:var(--green);border:1px solid var(--green)}
.status-bar{display:flex;gap:12px;align-items:center;padding:10px;background:#f1f3f4;border-radius:6px;font-size:0.85rem;margin:10px 0}
.status-bar .key{font-weight:600;color:var(--text2)}
</style>
</head>
<body>
<div class="container">
<h1>📋 整机BOM配置表</h1>
<p style="color:var(--text2);font-size:0.9rem;margin-bottom:16px">
将客户 BOM 转换为 SW 节点整机BOM配置表格式，含项目名称、供应商展开、物料名称。
</p>

<!-- 步骤指示器 -->
<div class="steps">
<div class="step active" id="step1-ind">① 上传文件</div>
<div class="step" id="step2-ind">② 列映射</div>
<div class="step" id="step3-ind">③ 输出设置</div>
<div class="step" id="step4-ind">④ 完成</div>
</div>

<!-- 步骤1: 上传 -->
<div class="card" id="step1">
<h3>上传 BOM 文件</h3>
<form id="uploadForm">
<div class="form-row">
<div class="form-group">
<label>选择 Excel 文件 (.xlsx)</label>
<input type="file" name="file" accept=".xlsx" required>
</div>
</div>
<div class="form-actions">
<button type="submit" class="btn btn-primary" id="scanBtn">📡 扫描列结构</button>
</div>
</form>
<div id="loadingSpinner" class="loading" style="display:none">
<div><span class="spinner"></span>正在扫描文件中...</div>
</div>
</div>

<!-- 步骤2: 列映射 -->
<div class="card" id="step2" style="display:none">
<h3>列映射配置</h3>
<div id="fileInfo" class="status-bar" style="display:none">
  <span><span class="key">文件:</span> <span id="fileName"></span></span>
  <span><span class="key">Sheet:</span>
    <select id="sheetSelect" onchange="onSheetChange()"></select>
  </span>
  <span><span class="key">表头行:</span>
    <input type="number" id="headerRowInput" value="1" min="1" max="20" style="width:50px" onchange="onHeaderRowChange()">
  </span>
  <button class="btn" style="padding:2px 10px;font-size:0.75rem" onclick="doRescan()">⟳ 重新扫描</button>
</div>

<div id="scanResult" style="display:none">
<h4 style="margin:12px 0 6px;font-size:0.9rem">🔍 自动扫描结果</h4>
<div class="scan-result" id="scanResultContainer"></div>
</div>

<h4 style="margin:12px 0 6px;font-size:0.9rem">📐 列映射（自动检测，可手动修改）</h4>
<div class="form-row">
<div class="form-group">
<label>品牌/厂家列 <span class="detected-badge badge-A">必填</span></label>
<select id="colBrand" onchange="updateFormat()"></select>
</div>
<div class="form-group">
<label>型号列 <span style="font-size:0.75rem;color:var(--text2)">(仅BC格式需要)</span></label>
<select id="colModel" onchange="updateFormat()"></select>
</div>
<div class="form-group">
<label>用量列 <span class="detected-badge badge-qty">建议</span></label>
<select id="colQty"></select>
</div>
<div class="form-group">
<label>物料名称列 <span class="detected-badge badge-name" style="background:var(--red)">必填</span></label>
<select id="colName"></select>
</div>
</div>

<h4 style="margin:12px 0 6px;font-size:0.9rem">👁️ 数据预览（前10行）</h4>
<div class="preview-wrap" id="previewTable"></div>

<div class="form-actions">
<button class="btn btn-primary" onclick="goStep3()">下一步 →</button>
</div>
</div>

<!-- 步骤3: 输出设置 -->
<div class="card" id="step3" style="display:none">
<h3>输出设置</h3>
<div class="form-row">
<div class="form-group">
<label>格式模式</label>
<select id="fmtSelect">
<option value="A">格式A — 品牌型号合并列（||分隔）</option>
<option value="B">格式B — 厂家/型号分列（;分隔）</option>
<option value="C">格式C — 制造商含编号（:分隔）</option>
<option value="auto">自动检测</option>
</select>
</div>
<div class="form-group">
<label>项目名称 <span class="detected-badge" style="background:var(--red)">必填</span></label>
<input type="text" id="projectName" placeholder="请输入项目名称">
</div>
</div>
<div id="convertInfo" class="status-bar">
<span class="key">当前格式:</span> <span id="currentFmtDisplay">格式A</span>
</div>
<div class="form-actions">
<button class="btn" onclick="goStep2()" style="background:#e8eaed">← 返回</button>
<button class="btn btn-success" id="convertBtn" onclick="doConvert()">🔄 开始转换</button>
</div>
</div>

<!-- 步骤4: 完成 -->
<div class="card" id="step4" style="display:none">
<h3>✅ 转换完成</h3>
<div id="resultAlert" class="alert"></div>
<div class="form-actions">
<a id="downloadLink" class="btn btn-primary" style="display:none;text-decoration:none" download>⬇️ 下载整机BOM配置表</a>
<button class="btn" onclick="resetAll()" style="background:#e8eaed">🔄 转换另一份</button>
</div>
</div>

</div>

<script>
let hqState = {
  sheets: [],
  currentSheet: '',
  headers: [],
  detected: {},
  colResults: {},
  preview: [],
  fileName: '',
  file_id: ''
};

function $(id) { return document.getElementById(id); }
function show(id) { id.style.display = id.tagName === 'DIV' ? 'block' : null; }
function hide(id) { id.style.display = 'none'; }

function showStep(n) {
  for (let i = 1; i <= 4; i++) {
    $(`step${i}`).style.display = i === n ? 'block' : 'none';
    const ind = $(`step${i}-ind`);
    ind.className = 'step';
    if (i < n) ind.classList.add('done');
    else if (i === n) ind.classList.add('active');
  }
}

document.getElementById('uploadForm').onsubmit = async function(e) {
  e.preventDefault();
  const fd = new FormData(this);
  hqState.fileName = fd.get('file').name;

  $('loadingSpinner').style.display = 'block';
  $('scanBtn').disabled = true;

  try {
    const resp = await fetch('/api/bom-hq/sheets', { method: 'POST', body: fd });
    const data = await resp.json();
    if (!data.success) { alert('扫描失败: ' + data.error); return; }

    hqState.file_id = data.file_id || '';
    hqState.sheets = data.sheets;
    hqState.currentSheet = data.current_sheet;
    hqState.headers = data.headers;
    hqState.detected = data.detected || {};
    hqState.colResults = data.col_results || {};
    hqState.preview = data.preview || [];

    showScanResult();
    populateColumnSelects();
    renderPreview();
    showStep(2);
  } catch (err) {
    alert('网络错误: ' + err.message);
  } finally {
    $('loadingSpinner').style.display = 'none';
    $('scanBtn').disabled = false;
  }
};

function onSheetChange() {
  const sheet = $('sheetSelect').value;
  if (sheet !== hqState.currentSheet) doRescan();
}

function onHeaderRowChange() {
  doRescan();
}

async function doRescan() {
  if (!hqState.file_id) { alert('请先上传文件'); return; }
  const sheet_name = $('sheetSelect').value || hqState.currentSheet;
  const header_row = parseInt($('headerRowInput').value) || 1;

  $('loadingSpinner').style.display = 'block';

  const fd = new FormData();
  fd.append('file_id', hqState.file_id);
  fd.append('sheet_name', sheet_name);
  fd.append('header_row', header_row);

  try {
    const resp = await fetch('/api/bom/rescan', { method: 'POST', body: fd });
    const data = await resp.json();
    if (!data.success) { alert('重新扫描失败: ' + data.error); return; }

    hqState.currentSheet = data.current_sheet;
    hqState.headers = data.headers;
    hqState.detected = data.detected || {};
    hqState.colResults = data.col_results || {};
    hqState.preview = data.preview || [];

    const sel = $('sheetSelect');
    sel.innerHTML = (data.sheets || []).map(s =>
      `<option value="${s}" ${s === data.current_sheet ? 'selected' : ''}>${s}</option>`
    ).join('');

    showScanResult();
    populateColumnSelects();
    renderPreview();
  } catch (err) {
    alert('网络错误: ' + err.message);
  } finally {
    $('loadingSpinner').style.display = 'none';
  }
}

function showScanResult() {
  const container = $('scanResultContainer');
  container.innerHTML = '';
  const results = hqState.colResults;
  const keys = Object.keys(results);
  if (keys.length === 0) {
    container.innerHTML = '<div style="color:var(--text2);padding:10px">未检测到已知列类型，请手动选择列映射</div>';
    return;
  }
  for (const letter of keys) {
    const info = results[letter];
    const badgeClass = info.role.includes('A') ? 'badge-A' : info.role.includes('B') ? 'badge-B' : info.role.includes('C') ? 'badge-C' : info.role === '用量' ? 'badge-qty' : 'badge-name';
    const samples = info.sample.filter(s => s).slice(0, 2).join(', ');
    container.innerHTML += `<div class="scan-item">
      <span><span class="col-letter">${letter}</span> <span class="role">${info.header}</span></span>
      <span><span class="detected-badge ${badgeClass}">${info.role}</span> <span class="samples">${samples}</span></span>
    </div>`;
  }
  $('scanResult').style.display = 'block';
  $('fileInfo').style.display = 'flex';
  $('fileName').textContent = hqState.fileName;
  const sel = $('sheetSelect');
  sel.innerHTML = hqState.sheets.map(s =>
    `<option value="${s}" ${s === hqState.currentSheet ? 'selected' : ''}>${s}</option>`
  ).join('');
}

function populateColumnSelects() {
  const headers = ['(自动检测)'];
  if (hqState.headers) {
    hqState.headers.forEach((h, i) => {
      if (h) headers.push(`${getColLetter(i + 1)}: ${h}`);
      else headers.push(`${getColLetter(i + 1)}: (空白)`);
    });
  }
  const map = { colBrand: 'brand', colModel: 'model', colQty: 'qty', colName: 'name' };
  for (const [selId, key] of Object.entries(map)) {
    const sel = $(selId);
    sel.innerHTML = headers.map((h, i) => {
      const v = i === 0 ? '' : getColLetter(i);
      return `<option value="${v}">${h}</option>`;
    }).join('');
    if (hqState.detected[key]) {
      sel.value = hqState.detected[key];
    }
  }
  updateFormat();
}

function getColLetter(i) {
  let s = '';
  while (i > 0) {
    i--;
    s = String.fromCharCode(65 + (i % 26)) + s;
    i = Math.floor(i / 26);
  }
  return s;
}

function updateFormat() {
  const fmt = hqState.detected.fmt || '';
  const display = $('currentFmtDisplay');
  if (fmt === 'A')      display.textContent = '格式A (合并列 || 分隔)';
  else if (fmt === 'B') display.textContent = '格式B (分列 ; 分隔)';
  else if (fmt === 'C') display.textContent = '格式C (制造商编号 : 分隔)';
  else display.textContent = $('colModel').value ? '自动检测 (B/C)' : '格式A (合并列)';
}

function goStep2() { showStep(2); }
function goStep3() { showStep(3); }

function renderPreview() {
  const wrap = $('previewTable');
  if (!hqState.preview || hqState.preview.length === 0) {
    wrap.innerHTML = '<div style="padding:20px;text-align:center;color:var(--text2)">无数据预览</div>';
    return;
  }
  let html = '<table><thead><tr>';
  const maxCol = Math.min(hqState.preview[0]?.length || 5, 10);
  for (let ci = 0; ci < maxCol; ci++) {
    const letter = getColLetter(ci + 1);
    const h = hqState.headers?.[ci] || '';
    html += `<th>${letter}<br><small>${h}</small></th>`;
  }
  html += '</tr></thead><tbody>';
  for (let ri = 0; ri < Math.min(hqState.preview.length, 11); ri++) {
    html += '<tr>';
    for (let ci = 0; ci < maxCol; ci++) {
      html += `<td>${(hqState.preview[ri][ci] || '').substring(0, 20)}</td>`;
    }
    html += '</tr>';
  }
  html += '</tbody></table>';
  wrap.innerHTML = html;
}

async function doConvert() {
  const btn = $('convertBtn');
  const projectName = $('projectName').value.trim();
  if (!projectName) { alert('请填写项目名称'); return; }

  btn.disabled = true;
  btn.textContent = '⏳ 转换中...';

  const fileInput = document.querySelector('input[name="file"]');
  if (!fileInput.files[0]) { alert('请重新上传文件'); btn.disabled = false; btn.textContent = '🔄 开始转换'; return; }

  const fd = new FormData();
  fd.append('file', fileInput.files[0]);
  fd.append('fmt', $('fmtSelect').value);
  fd.append('sheet', hqState.currentSheet);
  fd.append('header_row', parseInt($('headerRowInput').value) || 1);
  fd.append('project_name', projectName);
  fd.append('col_brand', $('colBrand').value);
  fd.append('col_model', $('colModel').value);
  fd.append('col_qty', $('colQty').value);
  fd.append('col_name', $('colName').value);

  try {
    const resp = await fetch('/bom-hq', { method: 'POST', body: fd });
    const data = await resp.json();
    if (!data.success) {
      $('resultAlert').className = 'alert alert-error';
      $('resultAlert').textContent = '❌ 转换失败: ' + (data.error || '未知错误');
      $('resultAlert').style.display = 'block';
      $('downloadLink').style.display = 'none';
    } else {
      $('resultAlert').className = 'alert alert-success';
      $('resultAlert').textContent = '✅ ' + (data.message || '转换成功');
      $('resultAlert').style.display = 'block';
      const link = $('downloadLink');
      link.href = data.download;
      link.style.display = 'inline-block';
    }
    showStep(4);
  } catch (err) {
    $('resultAlert').className = 'alert alert-error';
    $('resultAlert').textContent = '❌ 网络错误: ' + err.message;
    $('resultAlert').style.display = 'block';
    $('downloadLink').style.display = 'none';
    showStep(4);
  } finally {
    btn.disabled = false;
    btn.textContent = '🔄 开始转换';
  }
}

function resetAll() {
  showStep(1);
  document.getElementById('uploadForm').reset();
  $('step2').style.display = 'none';
  $('step3').style.display = 'none';
  $('step4').style.display = 'none';
  hqState = { sheets: [], currentSheet: '', headers: [], detected: {}, colResults: {}, preview: [], fileName: '', file_id: '' };
}
</script>
</body>
</html>
